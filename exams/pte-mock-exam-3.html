<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTE Academic Mock Exam 3 (2026 Format)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:#e8ecf1;color:#1c2733;font-size:16px;line-height:1.55}
#app{min-height:100%;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- header ---------- */
.topbar{background:#123c6d;color:#fff;padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .logo{font-weight:700;font-size:18px;letter-spacing:.5px}
.topbar .logo span{color:#7fd1f7}
.topbar .mode{font-size:12px;padding:2px 10px;border-radius:10px;background:#0a2a4e;border:1px solid #3d6d9e}
.topbar .mode.guide{background:#3d2a00;border-color:#c79a2e}
.topbar .spacer{flex:1}
.topbar .timerbox{font-variant-numeric:tabular-nums;background:#0a2a4e;border:1px solid #3d6d9e;border-radius:6px;padding:3px 12px;font-size:15px}
.topbar .timerbox.warn{border-color:#e05555;color:#ffb3b3}
.progress{height:5px;background:#0a2a4e}
.progress>div{height:100%;background:#41b6e6;width:0;transition:width .3s}

/* ---------- layout ---------- */
.main{flex:1;max-width:1020px;width:100%;margin:0 auto;padding:26px 22px 90px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(16,42,67,.15);padding:26px 30px;margin-bottom:18px}
.partlabel{font-size:13px;color:#5b6b7b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
h1{font-size:26px;color:#123c6d;margin-bottom:10px}
h2{font-size:21px;color:#123c6d;margin-bottom:8px}
h3{font-size:16px;color:#123c6d;margin:14px 0 6px}
.qtype-head{border-bottom:1px solid #dde4ea;padding-bottom:12px;margin-bottom:16px}
.qtype-head .qtitle{font-size:19px;font-weight:600;color:#123c6d}
.qtype-head .qpos{font-size:13px;color:#5b6b7b;float:right}
.instructions{color:#3d4f60;margin:6px 0 14px;font-size:15px}
.promptbox{background:#f2f6fa;border:1px solid #d5e0ea;border-radius:6px;padding:16px 20px;margin:12px 0;font-size:17px}
.figbox{background:#fff;border:1px solid #d5e0ea;border-radius:6px;padding:14px;margin:12px 0;text-align:center}
.figbox svg{max-width:100%;height:auto}
.mono{font-family:Consolas,monospace;font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-block;border:none;border-radius:5px;padding:10px 26px;font-size:15px;font-weight:600;background:#123c6d;color:#fff}
.btn:hover{background:#0d3058}
.btn:disabled{background:#9fb2c3;cursor:not-allowed}
.btn.sec{background:#fff;color:#123c6d;border:1px solid #123c6d}
.btn.sec:hover{background:#eef3f8}
.btn.warn{background:#b3261e}
.btn.small{padding:5px 14px;font-size:13px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.modewrap{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0}
.modecard{flex:1;min-width:260px;border:2px solid #d5e0ea;border-radius:8px;padding:20px 22px;cursor:pointer;background:#fff}
.modecard:hover{border-color:#41b6e6}
.modecard h3{margin-top:0}
.modecard ul{margin:8px 0 0 18px;font-size:14px;color:#3d4f60}

/* ---------- status / recording ---------- */
.statusbar{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.statusline{font-weight:600;color:#123c6d}
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c4cdd6}
.recdot.on{background:#e02424;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.audbar{flex:1;min-width:180px;height:8px;background:#dde4ea;border-radius:4px;overflow:hidden}
.audbar>div{height:100%;background:#41b6e6;width:0}
.audbar.rec>div{background:#e02424}
.timechip{font-variant-numeric:tabular-nums;font-weight:600;color:#123c6d;background:#eef3f8;border-radius:5px;padding:4px 12px}

/* ---------- guide tips ---------- */
.tipsbox{background:#fff8e6;border:1px solid #e8cf8a;border-left:5px solid #e0a800;border-radius:6px;padding:14px 18px;margin:14px 0;font-size:14px}
.tipsbox h4{color:#7a5800;margin-bottom:6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.tipsbox ul{margin-left:18px}
.tipsbox li{margin:3px 0}
.samplebox{background:#eafaf0;border:1px solid #9edbb4;border-radius:6px;padding:14px 18px;margin:12px 0;font-size:14.5px}
.samplebox h4{color:#166534;margin-bottom:6px;font-size:14px}

/* ---------- inputs ---------- */
textarea{width:100%;border:1px solid #b9c6d2;border-radius:6px;padding:12px;font-family:inherit;font-size:16px;line-height:1.6;resize:vertical}
textarea:focus{outline:2px solid #41b6e6}
input[type=text]{border:1px solid #b9c6d2;border-radius:5px;padding:8px 10px;font-size:15px;font-family:inherit}
input[type=text]:focus{outline:2px solid #41b6e6}
.wordcount{font-size:13px;color:#5b6b7b;margin-top:6px}
.wordcount.bad{color:#b3261e;font-weight:600}
select{border:1px solid #8fa4b8;border-radius:4px;padding:3px 6px;font-size:15px;background:#eef3f8;margin:0 2px}
.optrow{display:block;padding:9px 12px;border:1px solid #d5e0ea;border-radius:6px;margin:7px 0;cursor:pointer}
.optrow:hover{background:#f2f6fa}
.optrow.sel{border-color:#123c6d;background:#eaf3fb}
.optrow input{margin-right:9px}

/* ---------- reading layout ---------- */
.readwrap{display:flex;gap:18px}
.readnav{width:170px;flex-shrink:0}
.readnav button{display:block;width:100%;text-align:left;margin-bottom:5px;padding:7px 10px;border:1px solid #d5e0ea;background:#fff;border-radius:5px;font-size:13px}
.readnav button.cur{border-color:#123c6d;background:#eaf3fb;font-weight:600}
.readnav button.done::after{content:" ✓";color:#1a7f37}
.readmain{flex:1;min-width:0}
@media(max-width:760px){.readwrap{flex-direction:column}.readnav{width:100%;display:flex;flex-wrap:wrap}.readnav button{width:auto}}

/* ---------- drag blanks ---------- */
.fibbank{border:1px dashed #8fa4b8;border-radius:6px;padding:10px;margin:12px 0;min-height:48px}
.chip{display:inline-block;background:#123c6d;color:#fff;border-radius:4px;padding:5px 13px;margin:4px;cursor:pointer;font-size:14px;user-select:none}
.chip.used{opacity:.3;pointer-events:none}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid #123c6d;padding:2px 8px;margin:0 3px;text-align:center;cursor:pointer;color:#123c6d;font-weight:600;background:#eef3f8;border-radius:4px 4px 0 0}
.blank:empty::before{content:"\\200b"}

/* ---------- reorder ---------- */
.reitem{border:1px solid #d5e0ea;border-radius:6px;background:#fff;padding:11px 14px;margin:6px 0;display:flex;align-items:center;gap:10px}
.reitem .mv{display:flex;flex-direction:column;gap:2px}
.reitem .mv button{border:1px solid #b9c6d2;background:#f2f6fa;border-radius:4px;font-size:11px;padding:1px 8px;line-height:1.4}
.reitem .txt{flex:1}

/* ---------- HIW ---------- */
.hiw-word{cursor:pointer;padding:1px 2px;border-radius:3px}
.hiw-word:hover{background:#ffe9a8}
.hiw-word.sel{background:#f9c74f;color:#5b4300;font-weight:600}

/* ---------- review ---------- */
.scorebig{font-size:34px;font-weight:700;color:#123c6d}
.revitem{border:1px solid #dde4ea;border-radius:6px;padding:14px 18px;margin:10px 0;background:#fff}
.revitem h4{color:#123c6d;font-size:15px;margin-bottom:6px}
.revitem .ok{color:#1a7f37;font-weight:600}
.revitem .no{color:#b3261e;font-weight:600}
.revitem .ua{background:#f2f6fa;border-radius:4px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.badge{display:inline-block;font-size:12px;border-radius:9px;padding:1px 10px;margin-left:8px}
.badge.ok{background:#d9f2e3;color:#1a7f37}
.badge.no{background:#fadbd8;color:#b3261e}
.badge.na{background:#e8ecf1;color:#5b6b7b}
audio{display:block;margin:8px 0;max-width:100%}
.kv{font-size:14px;color:#3d4f60;margin:4px 0}

.footer-note{max-width:1020px;margin:0 auto;padding:12px 22px 30px;font-size:12.5px;color:#77879a}

</style>
</head>

<script>
const EXAM = {"meta":{"id":3,"title":"PTE Academic Mock Exam 3 (2026 Format)"},"readAloud":[{"text":"Archaeologists have long debated why the Maya civilisation abandoned its great stone cities during the ninth century. Evidence from lake sediments indicates that the region suffered a series of severe droughts lasting several decades. Combined with soil exhaustion and constant warfare between rival kingdoms, these dry periods may have made urban life unsustainable, forcing populations to migrate towards coastal areas."},{"text":"Children develop language at an astonishing pace between their first and fifth birthdays. During this period, a typical child learns thousands of words and masters the basic grammatical rules of their native tongue without any formal instruction. Researchers believe that early exposure to rich conversation, storytelling, and shared reading significantly influences the size of a child's vocabulary."},{"text":"Volcanoes form where molten rock, known as magma, rises from deep within the Earth and erupts at the surface. Although eruptions are often destructive, volcanic activity also creates highly fertile soils that support dense agricultural populations. In countries such as Indonesia and Italy, farmers have cultivated the slopes of active volcanoes for centuries, accepting the risks in exchange for exceptional harvests."},{"text":"Every year, millions of birds undertake extraordinary journeys between their breeding and wintering grounds. Some species travel more than ten thousand kilometres, navigating by the sun, the stars, and the Earth's magnetic field. Scientists track these migrations using lightweight satellite tags, and their data have revealed that many routes are learned from older birds rather than being purely instinctive."},{"text":"Tourism now accounts for roughly ten percent of global economic output and provides employment for hundreds of millions of people. While the industry brings income and investment to developing regions, it can also inflate local prices, damage fragile environments, and displace traditional communities. Sustainable tourism initiatives aim to balance these costs by directing visitor spending towards conservation and local businesses."},{"text":"Artificial reefs, constructed from sunken ships, concrete blocks, and specially designed modules, provide hard surfaces where marine life can attach and flourish. Within a few years of deployment, these structures become colonised by corals, sponges, and fish, creating ecosystems that rival natural reefs in diversity. They also reduce fishing pressure on natural reefs by attracting divers and anglers elsewhere."},{"text":"Nutrition science has moved far beyond simply counting calories. Researchers now study how the timing of meals, the diversity of gut bacteria, and the degree of food processing influence health outcomes. Highly processed foods, even when matched for calories with whole foods, appear to promote overeating, possibly because they are softer, quicker to consume, and engineered to be intensely flavourful."}],"repeatSentence":[{"text":"The archaeology department is organising a field trip next semester."},{"text":"Please return all borrowed equipment to the technician before Thursday."},{"text":"The guest speaker will arrive fifteen minutes before the lecture begins."},{"text":"Tuition fees for international students will rise slightly next year."},{"text":"The volcano observatory issues daily reports during periods of activity."},{"text":"You should book your accommodation well before the semester starts."},{"text":"The statistics workshop has been moved to a larger lecture theatre."},{"text":"Migrant birds arrive at the wetlands every autumn without fail."},{"text":"The economics tutorial was cancelled because the tutor was unwell."},{"text":"All essays must include a reference list in the correct format."}],"describeImage":[{"title":"Electric scooter trips per day, four European cities (thousands)","sample":"The bar chart shows the average number of daily electric scooter trips in four European cities. Paris records by far the highest figure, at around 150 thousand trips per day. Berlin follows with approximately 90 thousand, while Madrid registers about 60 thousand. Warsaw has the lowest usage, at roughly 25 thousand trips daily. Overall, electric scooters are most popular in Paris and least used in Warsaw.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><line x1='60' y1='260' x2='500' y2='260' stroke='#333'/><line x1='60' y1='20' x2='60' y2='260' stroke='#333'/><text x='30' y='265' font-size='11'>0<\/text><text x='24' y='205' font-size='11'>50<\/text><text x='18' y='145' font-size='11'>100<\/text><text x='18' y='85' font-size='11'>150<\/text><rect x='90' y='80' width='70' height='180' fill='#3a7d44'/><rect x='190' y='152' width='70' height='108' fill='#3a7d44'/><rect x='290' y='188' width='70' height='72' fill='#3a7d44'/><rect x='390' y='230' width='70' height='30' fill='#3a7d44'/><text x='112' y='278' font-size='12'>Paris<\/text><text x='210' y='278' font-size='12'>Berlin<\/text><text x='307' y='278' font-size='12'>Madrid<\/text><text x='405' y='278' font-size='12'>Warsaw<\/text><\/svg>"},{"title":"Global e-waste generated, 2015–2025 (million tonnes)","sample":"The line graph illustrates the amount of electronic waste generated worldwide between 2015 and 2025. In 2015, the figure stood at about 45 million tonnes. It rose steadily to around 54 million tonnes in 2020 and then climbed more sharply, reaching approximately 65 million tonnes by 2025. Overall, global e-waste increased continuously throughout the period, with the fastest growth occurring after 2020.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><line x1='60' y1='260' x2='500' y2='260' stroke='#333'/><line x1='60' y1='20' x2='60' y2='260' stroke='#333'/><text x='26' y='265' font-size='11'>40<\/text><text x='26' y='185' font-size='11'>50<\/text><text x='26' y='105' font-size='11'>60<\/text><text x='26' y='25' font-size='11'>70<\/text><polyline points='80,140 130,128 180,116 230,104 280,88 330,72 380,58 430,44 500,28' fill='none' stroke='#7b4fa6' stroke-width='3'/><circle cx='80' cy='140' r='4' fill='#7b4fa6'/><circle cx='280' cy='88' r='4' fill='#7b4fa6'/><circle cx='500' cy='28' r='4' fill='#7b4fa6'/><text x='70' y='278' font-size='11'>2015<\/text><text x='268' y='278' font-size='11'>2020<\/text><text x='480' y='278' font-size='11'>2025<\/text><\/svg>"},{"title":"Sources of household waste in a typical city","sample":"The pie chart shows the composition of household waste in a typical city. Organic material such as food scraps forms the largest share, at 40 percent. Paper and cardboard account for 25 percent, followed by plastics at 15 percent. Glass and metals each represent 10 percent of the total. In conclusion, organic waste and paper together make up nearly two-thirds of everything households throw away.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><circle cx='180' cy='150' r='110' fill='#3a7d44'/><path d='M180,150 L180,40 A110,110 0 0 1 275,215 Z' fill='#e8a13d'/><path d='M180,150 L275,215 A110,110 0 0 1 155,259 Z' fill='#2f6db3'/><path d='M180,150 L155,259 A110,110 0 0 1 85,215 Z' fill='#d1495b'/><text x='330' y='80' font-size='12' fill='#3a7d44'>■ Organic 40%<\/text><text x='330' y='110' font-size='12' fill='#e8a13d'>■ Paper 25%<\/text><text x='330' y='140' font-size='12' fill='#2f6db3'>■ Plastics 15%<\/text><text x='330' y='170' font-size='12' fill='#d1495b'>■ Glass 10%<\/text><text x='330' y='200' font-size='12' fill='#999'>■ Metals 10%<\/text><\/svg>"}],"retellLecture":[{"title":"How remote sensing monitors the planet","sample":"The lecture explained how remote sensing satellites monitor the Earth. The speaker described how sensors measure reflected light and heat to detect deforestation, crop health, and urban growth. The technology has become cheaper and more detailed over time, and its images now support disaster response, such as mapping floods and wildfires within hours of an event.","text":"Remote sensing means gathering information about the Earth from a distance, usually by satellites or aircraft. Modern satellites carry sensors that record not only visible light but also infrared and microwave radiation, allowing them to see through clouds and operate at night. By comparing images taken over time, scientists can detect deforestation in the tropics, measure how quickly glaciers are retreating, and estimate the health of crops across entire continents. The technology has improved dramatically: thirty years ago, each pixel in a satellite image covered an area the size of a football field, whereas today commercial satellites can distinguish objects smaller than a car. Remote sensing has also become essential in disaster response, helping emergency teams map floods, wildfires, and earthquake damage within hours, so that aid can be directed where it is needed most."},{"title":"Why languages are disappearing","sample":"The lecture discussed the rapid disappearance of languages worldwide. The speaker explained that one language dies out roughly every two weeks, usually when a small community shifts to a dominant language for economic reasons. The consequences include the loss of unique knowledge about plants and history. Finally, the speaker described revival efforts such as recording elders and teaching endangered languages in schools.","text":"Of the roughly seven thousand languages spoken today, nearly half are considered endangered, and linguists estimate that one language falls silent every two weeks. Language loss usually happens gradually: younger generations switch to a dominant national language because it offers better education and employment, and within three generations the ancestral tongue may disappear entirely. The consequences go far beyond words. Every language encodes unique knowledge about local plants, weather patterns, and history, and this knowledge vanishes when the last speaker dies. Some communities, however, are fighting back. In New Zealand, Maori is now taught in immersion schools, and in Wales, government support has doubled the number of Welsh speakers under thirty. Technology helps too: linguists are recording the voices of elderly speakers and building digital archives before it is too late."}],"respondToSituation":[{"prompt":"You reserved a quiet study room in the library for a group project, but when you arrive, another group is sitting inside and refuses to leave. Your project meeting starts in five minutes. Speak to the other group. What would you say?","audio":"You reserved a quiet study room in the library for a group project, but when you arrive, another group is sitting inside and refuses to leave. Your project meeting starts in five minutes. Speak to the other group. What would you say?","sample":"Hi everyone, sorry to interrupt. I think there might be a mix-up — our group actually booked this room from three o'clock today. Here's the confirmation email on my phone with the room number and the time slot. Our project meeting starts in five minutes and we really need the space. If you don't have a booking, maybe I could help you find a free room — I think there are usually a couple available on the second floor, or you could ask at the front desk. I'd really appreciate it if you could pack up in the next couple of minutes so we can set up. Thanks a lot for understanding, and sorry for the hassle."},{"prompt":"Your landlord wants to increase your rent by twenty percent with only two weeks' notice, but your rental contract says increases require two months' notice. Phone your landlord to discuss the situation. What would you say?","audio":"Your landlord wants to increase your rent by twenty percent with only two weeks' notice, but your rental contract says increases require two months' notice. Phone your landlord to discuss the situation. What would you say?","sample":"Hello Mr Davies, it's Maria from flat two. I'm calling about the rent increase notice I received yesterday. I've checked my contract, and it states that any increase requires at least two months' written notice, but this letter gives only two weeks, so I don't think it can legally take effect yet. Also, twenty percent is a very large jump — I'd struggle to afford that on my current budget. I'd like to suggest we meet and discuss a more gradual increase, perhaps spread over the next year. I've always paid on time and looked after the flat, so I hope we can reach an agreement that works for both of us. Could you call me back when you're free? Thank you."}],"summarizeGroupDiscussion":[{"topic":"Should public libraries lend tools and equipment, not just books?","sample":"The group discussed whether libraries should lend tools and equipment as well as books. Speaker A supported the idea, arguing that many people cannot afford items like drills or sewing machines and only need them occasionally. Speaker B raised concerns about insurance, safety, and maintenance costs, suggesting libraries partner with existing tool-sharing schemes instead. Speaker C proposed a compromise: starting with a small pilot collection of low-risk items such as board games and sewing kits. They agreed the concept had merit but required careful planning and funding.","turns":[{"speaker":"A","text":"I think it's a brilliant idea. Most people use a power drill maybe twice a year, so why should every household buy one? Libraries already have the borrowing system in place — they'd just be extending it to objects people genuinely need."},{"speaker":"B","text":"I love the principle, but the practical side worries me. Who's responsible if someone injures themselves with a library chainsaw? The insurance alone could be enormous, and tools need cleaning, sharpening, and repair. That's a whole new staff skillset."},{"speaker":"A","text":"Other cities manage it, though. There's a tool library in Toronto that's been running for years without major problems."},{"speaker":"C","text":"Maybe we don't need to start with chainsaws. What if the library began with low-risk items — board games, sewing kits, telescopes, that kind of thing? A small pilot scheme would show whether people actually use it before we invest in expensive equipment."},{"speaker":"B","text":"A pilot I could support. And perhaps we partner with the community centre rather than doing everything through the library itself — they already run repair workshops."},{"speaker":"A","text":"Partnering makes sense, as long as the items are free to borrow with a library card. The whole point is equal access."}]},{"topic":"The university wants to replace printed course readers with digital-only materials. Discuss.","sample":"The speakers debated replacing printed course readers with digital-only materials. Speaker A welcomed the change, citing lower costs, instant updates, and environmental benefits. Speaker B argued that many students concentrate better on paper and that screens cause eye strain during long reading sessions. Speaker C suggested a hybrid model where digital is the default but students can order printed copies at cost price. They concluded that a hybrid approach with an opt-out option would satisfy most students.","turns":[{"speaker":"A","text":"Honestly, this is long overdue. Digital readers cost a fraction of printed ones, lecturers can update them every semester instead of using outdated editions, and think of the paper we'd save. My printed reader last term cost forty pounds and I barely opened it."},{"speaker":"B","text":"But that's exactly the problem — you barely opened it. Reading long texts on a screen is genuinely harder for a lot of people. I retain far more when I can physically highlight and flip pages. And after eight hours of lectures, the last thing my eyes need is more screen time."},{"speaker":"C","text":"Both of you have a point. Why not make digital the default, which saves the university money, but let students order a printed copy at cost price if they prefer? The print shop on campus could handle orders in a day or two."},{"speaker":"B","text":"I could live with that, provided the printed option isn't outrageously expensive and isn't quietly removed after a year."},{"speaker":"A","text":"Fine with me too, as long as nobody is forced to buy either version. Digital should be free, and print should be genuinely optional."}]}],"answerShortQuestion":[{"question":"What do you call a scientist who studies ancient objects and ruins?","answer":"An archaeologist"},{"question":"If a volcano is currently erupting or likely to erupt, what is its status described as?","answer":"Active"},{"question":"What is the name of the document you need to travel between countries?","answer":"A passport"},{"question":"Which part of the body pumps blood around the circulatory system?","answer":"The heart"},{"question":"What do we call a person who moves to live permanently in another country?","answer":"An immigrant"}],"summarizeWrittenText":[{"passage":"Animal intelligence was once measured almost entirely by how closely a species' abilities resembled human skills, a bias that led scientists to underestimate many creatures. Recent research, however, has revealed sophisticated cognition in unexpected places. Octopuses, whose nervous systems evolved along an entirely different path from our own, can unscrew jars, navigate mazes, and recognise individual human faces. Crows manufacture hooked tools from twigs and plan for future needs, caching food according to what they expect to want the following morning. Even bees, with brains smaller than a pinhead, can learn the abstract concept of zero and count up to four. These findings have forced a fundamental rethink of what intelligence is. Rather than a single ladder with humans at the top, intelligence is increasingly viewed as a diverse set of solutions that evolution has produced in response to each species' particular ecological challenges, making cross-species comparison far more complex than previously assumed.","sample":"Research revealing that octopuses, crows, and even bees possess sophisticated cognitive abilities has overturned the human-centred view of intelligence, which is now understood as a diverse collection of evolutionary solutions shaped by each species' specific ecological challenges rather than a single scale with humans at the top."},{"passage":"Urban planning in the twentieth century was dominated by the principle of zoning, which separated residential, commercial, and industrial areas into distinct districts connected by roads. While this approach protected households from factory pollution, it produced sprawling cities in which daily life was impossible without a car. In recent decades, planners have increasingly embraced the concept of the fifteen-minute city, where homes, workplaces, shops, schools, and parks all lie within a short walk or bicycle ride. Advocates argue that such neighbourhoods reduce emissions, improve public health through daily physical activity, and strengthen local economies. Critics, however, warn that denser mixed-use districts can drive up property prices and displace lower-income residents unless affordable housing is protected. Several European cities are now testing the model by converting traffic lanes into cycling paths, creating pocket parks in former car parks, and permitting small shops to open within residential blocks.","sample":"Although twentieth-century zoning created car-dependent sprawl, modern planners are adopting the fifteen-minute city concept, which promises lower emissions, better health, and stronger local economies by placing daily needs within walking distance, though critics caution that affordable housing must be protected to prevent the displacement of poorer residents."}],"essay":[{"prompt":"Some people believe that international tourism damages local cultures and environments and should be restricted, while others argue it brings essential economic benefits. Discuss both views and give your own opinion. Write 200–300 words.","sample":"Possible structure: (1) Introduction — paraphrase the debate, state your position. (2) Arguments for restriction: overcrowding of historic sites, damage to fragile ecosystems, inflation of local prices, culture turned into a performance for visitors. (3) Arguments for tourism: major employer in developing regions, funds conservation and heritage restoration, encourages infrastructure investment, promotes cross-cultural understanding. (4) Conclusion — your view, e.g. tourism should continue but be managed through visitor caps, tourist taxes, and sustainability rules. Useful phrases: 'It is often claimed that…', 'A strong argument in favour of…', 'Nevertheless, it must be acknowledged that…', 'On balance, I am convinced that…'"}],"reading":{"fibDropdown":[{"text":"Digital privacy has become a major {{1}} for internet users worldwide. Every time people browse websites or use mobile applications, companies {{2}} detailed information about their habits and preferences. Although this data is often used to {{3}} advertising, it can also be sold to third parties without the user's knowledge. In response, several governments have introduced laws requiring companies to obtain clear {{4}} before collecting personal information.","blanks":[{"options":["concern","concept","contract","contest"],"correct":0},{"options":["gather","guess","grant","guide"],"correct":0},{"options":["increase","personalise","prevent","publish"],"correct":1},{"options":["contract","payment","consent","comment"],"correct":2}]},{"text":"Migration has shaped human history for thousands of years. People leave their home countries for many reasons, {{1}} conflict, poverty, and the search for better opportunities. {{2}} migration is often portrayed negatively in the media, research shows that migrants frequently {{3}} significant economic benefits to their host countries. They fill labour shortages, start businesses, and pay taxes that {{4}} public services.","blanks":[{"options":["including","excluding","regarding","following"],"correct":0},{"options":["Because","Although","Unless","Until"],"correct":1},{"options":["bring","borrow","build","buy"],"correct":0},{"options":["damage","support","reduce","escape"],"correct":1}]},{"text":"The development of children's brains is strongly {{1}} by their earliest experiences. During the first three years of life, the brain forms more than a million new neural {{2}} every second. Positive interactions with caregivers, such as talking and playing, {{3}} these connections, while neglect and stress can weaken them. This is why high-quality early childhood education is considered one of the most {{4}} investments a society can make.","blanks":[{"options":["influenced","invented","included","ignored"],"correct":0},{"options":["corrections","connections","collections","directions"],"correct":1},{"options":["weaken","interrupt","strengthen","shorten"],"correct":2},{"options":["valuable","expensive","difficult","popular"],"correct":0}]},{"text":"Electronic waste is the fastest-growing waste stream in the world. Old phones, computers, and televisions contain {{1}} metals such as gold and copper, yet only a small fraction is ever recycled. Most devices end up in landfill sites, where toxic chemicals can {{2}} into soil and groundwater. Governments are now introducing regulations that {{3}} manufacturers to take back old products and {{4}} them responsibly.","blanks":[{"options":["valuable","common","artificial","invisible"],"correct":0},{"options":["look","leak","lead","lean"],"correct":1},{"options":["forbid","allow","require","persuade"],"correct":2},{"options":["destroy","recycle","export","replace"],"correct":1}]},{"text":"Artificial reefs are human-made structures placed on the sea floor to {{1}} marine life. Fishermen have used them for centuries, but modern reefs are scientifically designed to maximise the number of species they can {{2}}. Studies show that well-planned artificial reefs can increase fish populations and provide new {{3}} for divers. However, critics warn that reefs made from unsuitable materials may {{4}} the very ecosystems they are meant to protect.","blanks":[{"options":["remove","attract","escape","reduce"],"correct":1},{"options":["support","surround","separate","supply"],"correct":0},{"options":["problems","attractions","expenses","regulations"],"correct":1},{"options":["improve","protect","damage","measure"],"correct":2}]}],"mcMultiple":[{"passage":"Archaeology has been transformed by technologies borrowed from other sciences. Ground-penetrating radar allows researchers to detect buried walls and tombs without digging, preserving fragile sites for future generations. Satellite imagery has revealed thousands of previously unknown settlements hidden beneath jungle canopies and desert sands. Meanwhile, laboratory analysis of ancient DNA extracted from bones and teeth has overturned long-held theories about human migration, showing, for example, that modern Europeans carry genetic traces of several ancient populations. Despite these advances, traditional excavation remains essential, since only careful digging can reveal the precise context in which objects were buried.","question":"According to the passage, which of the following are true about modern archaeology?","options":["Radar lets archaeologists examine buried structures without excavating","Satellites have made traditional digging completely unnecessary","Ancient DNA analysis has changed theories about how humans migrated","Hidden settlements have been discovered through satellite images","Most archaeological finds are now made by amateur treasure hunters"],"answers":[0,2,3]},{"passage":"Nutrition researchers increasingly focus on the gut microbiome, the trillions of bacteria living in the digestive system. Studies show that people who eat a wide variety of plant foods host a more diverse community of gut bacteria, which is associated with better immune function and lower rates of obesity. Fermented foods such as yoghurt and kimchi appear to introduce beneficial microbes directly into the gut. In one trial, participants who ate six servings of fermented food daily showed reduced markers of inflammation within ten weeks. The researchers caution, however, that the field is young and that individual responses to the same diet can differ dramatically, so universal dietary rules remain difficult to establish.","question":"Which findings are reported in the passage?","options":["A varied plant-based diet is linked to more diverse gut bacteria","Fermented foods reduced inflammation markers in one study","All participants responded identically to the same diet","Gut bacteria diversity is associated with better immune function","Yoghurt cures obesity within ten weeks"],"answers":[0,1,3]}],"reorder":[{"sentences":["Electric scooters have appeared on the streets of hundreds of cities in just a few years.","Supporters praise them as a cheap, emission-free way to make short urban journeys.","Critics, however, point to cluttered pavements and a rising number of accidents involving riders and pedestrians.","In response, many city governments are introducing designated parking zones, speed limits, and mandatory insurance schemes."]},{"sentences":["Volcanic eruptions occur when pressure from molten rock beneath the Earth's crust forces material to the surface.","As magma rises, dissolved gases within it expand, much like the bubbles in a shaken bottle of soda.","If the magma is thick and traps these gases, the pressure builds until it explodes violently into the atmosphere.","If the magma is runny, however, the gases escape gently, producing slow-moving lava flows instead of explosions."]}],"fibDrag":[{"text":"Many migrating birds navigate using the Earth's magnetic field. Scientists believe special proteins in their eyes allow them to literally {{1}} magnetic lines, while tiny crystals in their beaks may {{2}} the field's intensity.","answers":["see","sense"],"bank":["see","sense","destroy","heavy","paint","quickly"]},{"text":"Local museums play a vital role in preserving regional {{1}}. Unlike national institutions, they focus on everyday objects that reveal how {{2}} people actually lived and worked.","answers":["history","ordinary"],"bank":["history","ordinary","imported","wealth","silent","future"]},{"text":"A balanced diet should include a wide {{1}} of plant foods. Different coloured vegetables provide different nutrients, so dietary {{2}} is just as important as quantity.","answers":["variety","diversity"],"bank":["variety","diversity","expense","rigid","cooking","uniform"]},{"text":"Satellite images allow scientists to {{1}} deforestation in remote regions. By comparing photographs taken years apart, researchers can measure exactly how much forest has {{2}}.","answers":["track","disappeared"],"bank":["track","disappeared","grown","ignore","frequent","solid"]}],"mcSingle":[{"passage":"Public libraries face an uncertain future in the digital age. Borrowing of printed books has fallen steadily for two decades, yet library visits have not declined at the same rate. Instead, many branches have reinvented themselves as community hubs, offering free internet access, coding classes for children, job-hunting support, and warm spaces in winter. Surveys consistently show that libraries are among the most trusted public institutions, valued especially by low-income households that cannot afford private alternatives. Their challenge, librarians say, is convincing funding bodies that their value can no longer be measured by book loans alone.","question":"What is the main idea of the passage?","options":["Libraries are closing rapidly because nobody visits them","Libraries survive by charging fees for internet access","Libraries are reinventing themselves as community hubs, though their funding depends on outdated measures","Printed books remain the only reason people use libraries"],"answer":2},{"passage":"Economists studying tourism have identified a pattern they call overtourism. When a destination becomes famous through films or social media, visitor numbers can grow faster than local infrastructure can handle. Residents of cities such as Venice and Barcelona report rising rents as landlords convert apartments into holiday lets, while historic streets become so crowded that daily life becomes difficult. Some destinations now charge entry fees or limit cruise ship arrivals. The paradox, economists note, is that the very popularity that enriches a destination can ultimately destroy the qualities that attracted visitors in the first place.","question":"According to the passage, what is the paradox of overtourism?","options":["Tourists spend less money than residents expect","A destination's popularity can destroy the qualities that made it attractive","Entry fees increase the number of visitors","Social media reduces interest in famous destinations"],"answer":1}]},"listening":{"summarizeSpokenText":[{"title":"What octopuses reveal about animal minds","sample":"The lecture explored octopus intelligence. The speaker explained that octopuses evolved intelligence independently from vertebrates, with most of their neurons located in their arms rather than the brain. Experiments show they can solve puzzles, unscrew jars, and remember individual humans. The lecture concluded that studying octopuses helps scientists understand that intelligence can evolve along very different biological paths.","audio":"The octopus offers a unique window into how intelligence can evolve. Our last common ancestor with the octopus was a simple worm-like creature that lived over five hundred million years ago, which means octopus intelligence developed entirely independently of our own. Most remarkably, two-thirds of an octopus's neurons are located not in its brain but in its arms, so each arm can process information and even make decisions on its own. In laboratory experiments, octopuses have learned to unscrew jars to reach food, navigate mazes from memory, and recognise individual human keepers, greeting familiar faces differently from strangers. In the wild, veined octopuses carry coconut shells around and assemble them into shelters, behaviour many scientists consider genuine tool use. Studying these animals matters because it shows intelligence is not a single human-style ability but a solution evolution can reach through completely different biological routes."},{"title":"The economics of mass tourism","sample":"The lecture examined the economic effects of mass tourism. The speaker explained that tourism creates jobs and foreign currency, but much of the profit leaks out to international hotel chains and cruise companies, with some destinations keeping only a small share of visitor spending. The lecture concluded that locally owned businesses and tourism taxes help destinations retain more of the money tourists bring.","audio":"Tourism is frequently described as an economic miracle for developing countries, and it does bring clear benefits: it creates millions of jobs, earns foreign currency, and funds infrastructure such as airports and roads. However, economists have identified a serious problem known as leakage. In many popular destinations, the hotels belong to international chains, the tour operators are foreign-owned, and even the food served to tourists is imported. Studies of some Caribbean islands suggest that as much as eighty percent of tourist spending leaks straight back out of the local economy. Cruise ships present an extreme case: thousands of passengers spend a few hours ashore, buy little beyond a coffee and a souvenir, and then eat and sleep back on board. The lesson, economists argue, is not to reject tourism but to manage it, by supporting locally owned businesses, training local workers for skilled positions, and using tourist taxes to fund public services."}],"mcMultiple":[{"audio":"Good morning, and welcome aboard the university's open day bus tour. A few quick announcements before we set off. The tour will last approximately ninety minutes, with stops at the engineering faculty, the sports centre, and the new student residences. Please note that the medical school is not included today because of ongoing construction work. Complimentary drinks and sandwiches will be served in the main hall after the tour finishes at one o'clock. If you registered for the afternoon session on course applications, please remain on the bus at the end, as it will take you directly to the admissions building. Finally, could everyone please keep their seatbelts fastened while the bus is moving.","question":"According to the announcement, which of the following are correct?","options":["The tour includes a stop at the sports centre","The medical school is excluded because of construction work","Lunch is provided free of charge after the tour","The afternoon session takes place in the engineering faculty","Passengers must wear seatbelts while the bus is moving"],"answers":[0,1,4]}],"fillBlanks":[{"display":"Good morning. Today's seminar examines how tourism affects coastal {{1}}. Uncontrolled development can destroy the natural {{2}} that attract visitors in the first place, so careful {{3}} is essential.","answers":["communities","landscapes","planning"],"audio":"Good morning. Today's seminar examines how tourism affects coastal communities. Uncontrolled development can destroy the natural landscapes that attract visitors in the first place, so careful planning is essential."},{"display":"All students on the geology trip must bring a {{1}} jacket, as the weather near the volcano can change {{2}}. We will return to the hotel before {{3}}.","answers":["waterproof","suddenly","sunset"],"audio":"All students on the geology trip must bring a waterproof jacket, as the weather near the volcano can change suddenly. We will return to the hotel before sunset."},{"display":"The new museum exhibition traces the journey of human {{1}} out of Africa. Interactive {{2}} show how early populations spread across the {{3}} over sixty thousand years ago.","answers":["migration","displays","continents"],"audio":"The new museum exhibition traces the journey of human migration out of Africa. Interactive displays show how early populations spread across the continents over sixty thousand years ago."}],"highlightCorrectSummary":[{"audio":"Electronic waste is growing three times faster than the world's population, and recycling rates remain stubbornly low. The core problem is design: modern devices are glued, soldered, and sealed, making them nearly impossible to dismantle economically. Some governments now require manufacturers to meet repairability standards, forcing companies to make spare parts available for at least seven years. France has gone further, introducing a repairability score displayed on every phone and laptop at the point of sale. Early evidence suggests the score works: consumers consistently choose higher-scoring products, and manufacturers have begun redesigning devices to compete.","options":["E-waste grows slowly, and recycling programmes have already solved most of the problem.","Devices are designed to be difficult to repair, but repairability laws and product scores are beginning to change both manufacturer behaviour and consumer choices.","France banned the sale of all sealed electronic devices in 2021.","Consumers ignore repairability scores, so manufacturers see no reason to redesign their products."],"answer":1}],"mcSingle":[{"audio":"Excuse me, Dr Patel? I've just read the feedback on my research proposal, and it says I need to narrow my topic. I originally wanted to study all the causes of bird migration, but you wrote that this is too broad for a first-year project. Could you help me choose a more focused question before Friday's deadline?","question":"Why is the student speaking to Dr Patel?","options":["To complain about a low mark","To ask for help narrowing a research topic","To request an extension to Friday","To change to a different course"],"answer":1}],"selectMissingWord":[{"audio":"Recycling old electronics is far more complicated than recycling paper or glass. A single smartphone contains dozens of different materials fused together, and separating them requires expensive machinery and skilled labour. That is why, in the long run, the most sustainable device is the one you never need to","options":["replace","charge","carry","unlock"],"answer":0,"fullText":"That is why, in the long run, the most sustainable device is the one you never need to replace."}],"highlightIncorrectWords":[{"words":[{"w":"The"},{"w":"museum"},{"w":"will"},{"w":"open"},{"w":"its"},{"w":"new"},{"w":"archaeology"},{"w":"gallery"},{"w":"next"},{"w":"spring.","wrong":true,"said":"month."},{"w":"The"},{"w":"exhibition"},{"w":"includes"},{"w":"pottery,"},{"w":"coins,"},{"w":"and"},{"w":"wooden","wrong":true,"said":"bronze"},{"w":"tools"},{"w":"discovered"},{"w":"near"},{"w":"the"},{"w":"ancient"},{"w":"harbour.","wrong":true,"said":"harvest."}]},{"words":[{"w":"Children"},{"w":"who"},{"w":"learn"},{"w":"musical"},{"w":"instruments"},{"w":"often"},{"w":"show"},{"w":"improved"},{"w":"memory"},{"w":"and"},{"w":"concentration."},{"w":"Teachers"},{"w":"report"},{"w":"that"},{"w":"these"},{"w":"students"},{"w":"perform"},{"w":"worse","wrong":true,"said":"better"},{"w":"in"},{"w":"mathematics"},{"w":"and"},{"w":"develop"},{"w":"weaker","wrong":true,"said":"stronger"},{"w":"listening"},{"w":"skills."}]}],"writeFromDictation":[{"text":"The archaeology lecture has been moved to the main hall."},{"text":"Tourist numbers have doubled over the past ten years."},{"text":"Please submit your field trip forms by Wednesday."}]}};

    tips: ["ONE sentence only — full stops inside the answer are fatal.", "Find the main claim, then attach 1–2 key supports with connectors (while, because, which, although).", "Aim 35–55 words.", "Save 1 minute to check subject-verb agreement and spelling."] },
  essay: { title: "Write Essay", part: 1,

    tips: ["2–3 min plan: position + 2 arguments + examples.", "Structure: introduction (paraphrase + thesis) → body 1 → body 2 → conclusion.", "Start each body paragraph with a clear topic sentence; add an example.", "Save 2 minutes to proofread articles, plurals, verb endings."] },

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function key() { return "s" + state.step; }

function later(fn, ms) { var id = setTimeout(fn, ms); state.timers.push(id); return id; }
function every(fn, ms) { var id = setInterval(fn, ms); state.timers.push(id); return id; }
function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function beep() {
  try {
    var ctx = beep._ctx || (beep._ctx = new (window.AudioContext || window.webkitAudioContext)());
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);

}

/* ================= TTS ================= */
function stopTTS() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} state.speaking = false; }
function speak(text, opts) {
  opts = opts || {};
  return new Promise(function (res) {
    if (!("speechSynthesis" in window)) { res(false); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.95; u.pitch = opts.pitch || 1; u.lang = opts.lang || "en-AU";
    u.onend = function () { res(true); };
    u.onerror = function () { res(false); };
    state.speaking = true;
    speechSynthesis.speak(u);
  });
}
function speakTurns(turns) {
  var pitches = { A: 1.0, B: 1.35, C: 0.75, D: 1.15 };
  var i = 0, cancelled = false;
  state.ttsCancel = function () { cancelled = true; };
  return new Promise(function (res) {
    (function next() {
      if (cancelled || i >= turns.length) { res(!cancelled); return; }
      speak(turns[i].text, { pitch: pitches[turns[i].speaker] || 1, rate: 0.95 }).then(next);
      i++;
    })();
  });
}

/* ================= audio play controller (enforces single play in real mode) ================= */
function playAudio(k, playFn, onDone) {
  if (state.mode === "real" && state.audioPlayed[k]) { if (onDone) onDone(false); return false; }
  state.audioPlayed[k] = true;

  return true;
}

/* ================= mic ================= */
function ensureMic() {
  if (state.mediaStream) return Promise.resolve(true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
  return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
    state.mediaStream = s; return true;
  }).catch(function () { return false; });
}
function startRecording(k) {
  if (!state.mediaStream) return false;
  state.recChunks = [];
  try { state.recorder = new MediaRecorder(state.mediaStream); } catch (e) { return false; }
  state.recorder.ondataavailable = function (e) { if (e.data.size) state.recChunks.push(e.data); };
  state.recorder.onstop = function () {
    var b = new Blob(state.recChunks, { type: state.recorder.mimeType || "audio/webm" });
    state.recordings[k] = URL.createObjectURL(b);
  };
  state.recorder.start();
  return true;
}
function stopRecording() {
  if (state.recorder && state.recorder.state !== "inactive") { try { state.recorder.stop(); } catch (e) {} }
}

  function runTimer(sec, label, rec, done) {
    var total = sec;

/* ================= scoring ================= */
function norm(s) { return (s || "").toLowerCase().trim().replace(/[.,;:!?'"()-]/g, ""); }
function scoreItem(type, d, ans) {
  /* returns {got, max, detail} or null for non-objective */
  if (type === "fibDropdown") {
    var got = 0; d.blanks.forEach(function (b, i) { if (ans && ans[i] != null && +ans[i] === b.correct) got++; });
    return { got: got, max: d.blanks.length };
  }
  if (type === "fibDrag") {
    var g2 = 0; d.answers.forEach(function (a, i) { if (ans && norm(ans[i]) === norm(a)) g2++; });
    return { got: g2, max: d.answers.length };
  }
  if (type === "mcMultiple" || type === "mcmL") {
    if (!ans || !ans.length) return { got: 0, max: d.answers.length };
    var sc = 0; ans.forEach(function (a) { sc += d.answers.indexOf(a) >= 0 ? 1 : -1; });
    return { got: Math.max(0, sc), max: d.answers.length };
  }
  if (type === "mcSingle" || type === "mcsL" || type === "hcs" || type === "smw")
    return { got: ans != null && +ans === d.answer ? 1 : 0, max: 1 };
  if (type === "reorder") {
    if (!ans) return { got: 0, max: d.sentences.length - 1 };
    var pos = {}; ans.forEach(function (si, p) { pos[si] = p; });
    var ok = 0; for (var i = 0; i < d.sentences.length - 1; i++) if (pos[i] < pos[i + 1]) ok++;
    return { got: ok, max: d.sentences.length - 1 };
  }
  if (type === "fillBlanksL") {
    var g3 = 0; d.answers.forEach(function (a, i) { if (ans && norm(ans[i]) === norm(a)) g3++; });
    return { got: g3, max: d.answers.length };
  }
  if (type === "hiw") {
    var wrongIdx = []; d.words.forEach(function (w, i) { if (w.wrong) wrongIdx.push(i); });
    if (!ans || !ans.length) return { got: 0, max: wrongIdx.length };
    var s2 = 0; ans.forEach(function (i) { s2 += wrongIdx.indexOf(i) >= 0 ? 1 : -1; });
    return { got: Math.max(0, s2), max: wrongIdx.length };
  }
  if (type === "wfd") {
    var ref = norm(d.text).split(/\s+/), usr = norm(ans).split(/\s+/), g4 = 0;
    for (var j = 0; j < ref.length; j++) if (usr[j] === ref[j]) g4++;
    return { got: g4, max: ref.length };
  }
  return null;
}
function answerSummary(type, d, ans) {
  if (ans == null) return "<i>No answer</i>";
  if (type === "fibDropdown") return d.blanks.map(function (b, i) { return "Blank " + (i + 1) + ": " + (ans[i] != null && ans[i] !== "" ? esc(b.options[ans[i]]) : "—"); }).join(" · ");
  if (type === "fibDrag" || type === "fillBlanksL") return d.answers.map(function (a, i) { return "Blank " + (i + 1) + ": " + (ans[i] ? esc(ans[i]) : "—"); }).join(" · ");
  if (type === "mcMultiple" || type === "mcmL") return ans.length ? ans.map(function (a) { return esc(d.options[a]); }).join(" + ") : "<i>No selection</i>";
  if (type === "mcSingle" || type === "mcsL" || type === "hcs" || type === "smw") return esc(d.options[ans]);
  if (type === "reorder") return ans.map(function (si) { return "(" + (si + 1) + ")"; }).join(" → ");
  if (type === "hiw") return ans.length ? ans.map(function (i) { return '"' + esc(d.words[i].w) + '"'; }).join(" ") : "<i>No words highlighted</i>";
  if (type === "wfd" || type === "summarizeWrittenText" || type === "essay" || type === "sst") return esc(ans).slice(0, 600);
  return esc(JSON.stringify(ans));
}
function correctSummary(type, d) {
  if (type === "fibDropdown" || type === "fibDrag" || type === "mcMultiple" || type === "mcSingle" || type === "reorder") return readingKeyText({ type: type, data: d });
  if (type === "mcmL") return "Correct: " + d.answers.map(function (a) { return esc(d.options[a]); }).join(" + ");
  if (type === "mcsL" || type === "hcs" || type === "smw") return "Correct: " + esc(d.options[d.answer]);
  if (type === "fillBlanksL") return "Answers: " + d.answers.map(esc).join(" · ");
  if (type === "hiw") return "Incorrect words: " + d.words.filter(function (w) { return w.wrong; }).map(function (w) { return '"' + esc(w.w) + '" → said "' + esc(w.said) + '"'; }).join(" · ");
  if (type === "wfd") return esc(d.text);
  return "";
}

    var badge = sc ? (sc.got >= sc.max ? '<span class="badge ok">' + sc.got + "/" + sc.max + "</span>" : '<span class="badge no">' + sc.got + "/" + sc.max + "</span>") : '<span class="badge na">self-review</span>';
    var body = "";

      if (cs) body += '<div class="ua" style="background:#eafaf0"><b>Correct:</b> ' + cs + "</div>";
      if (f.data.sample) body += sampleHtml("Sample response", f.data.sample);
      if (f.type === "summarizeWrittenText" || f.type === "essay" || f.type === "sst") {
        var n = wordCount(ans), lim = f.type === "summarizeWrittenText" ? [5, 75] : f.type === "sst" ? [50, 70] : [200, 300];
        body += '<div class="kv">Word count: <b class="' + (n >= lim[0] && n <= lim[1] ? "ok" : "no") + '">' + n + "</b> (required " + lim[0] + "–" + lim[1] + ")</div>";
      }
    }
    rows += '<div class="revitem"><h4>' + meta.title + " " + (f.idx + 1) + badge + "</h4>" + body + "</div>";
  });
  var pct = totMax ? Math.round(totGot / totMax * 100) : 0;
  render(chrome("Score report", "") +
    '<div class="main"><div class="card" style="text-align:center">' +
    "<h1>Score Report</h1>" +
    '<div class="scorebig">' + pct + "%</div>" +
    '<div class="kv">Auto-scored objective items: ' + totGot + " / " + totMax + " points</div>" +
    '<div class="kv">Speaking &amp; open writing tasks are self-reviewed against the sample responses below. This is an indicative practice score, not a Pearson score.</div>' +
    '<div class="navrow"><button class="btn sec" onclick="PTE.restart()">← Restart exam</button><button class="btn sec" onclick="PTE.toggleMode()">Switch to ' + (state.mode === "real" ? "Guide" : "Real") + " mode</button></div>" +
    "</div>" + rows + "</div>");
}

/* ================= public API ================= */
window.PTE = {
  pickMode: function (m) {
    state.mode = m;
    ensureMic();
    renderMicCheck();
  },
  showSample: function () {
    var w = document.getElementById("sampleWrap");
    if (w && window._pteSample) w.innerHTML = sampleHtml("Sample answer", window._pteSample);
  },
  restart: function () {
    clearTimers();
    state.step = -1; state.answers = {}; state.recordings = {}; state.audioPlayed = {}; state.readingLeft = 30 * 60;
    renderHome();
  },
  toggleMode: function () {
    state.mode = state.mode === "real" ? "guide" : "real";
    clearTimers();
    state.audioPlayed = {}; state.readingLeft = 30 * 60; state.step = -1;
    renderSectionIntro(1);
  }
};

/* ================= boot ================= */
buildFlow();
renderHome();
})();

</script>
</body>
</html>
