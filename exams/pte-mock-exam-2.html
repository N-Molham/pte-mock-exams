<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTE Academic Mock Exam 2 (2026 Format)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:#e8ecf1;color:#1c2733;font-size:16px;line-height:1.55}
#app{min-height:100%;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- header ---------- */
.topbar{background:#123c6d;color:#fff;padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .logo{font-weight:700;font-size:18px;letter-spacing:.5px}
.topbar .logo span{color:#7fd1f7}
.topbar .mode{font-size:12px;padding:2px 10px;border-radius:10px;background:#0a2a4e;border:1px solid #3d6d9e}
.topbar .mode.guide{background:#3d2a00;border-color:#c79a2e}
.topbar .spacer{flex:1}
.topbar .timerbox{font-variant-numeric:tabular-nums;background:#0a2a4e;border:1px solid #3d6d9e;border-radius:6px;padding:3px 12px;font-size:15px}
.topbar .timerbox.warn{border-color:#e05555;color:#ffb3b3}
.progress{height:5px;background:#0a2a4e}
.progress>div{height:100%;background:#41b6e6;width:0;transition:width .3s}

/* ---------- layout ---------- */
.main{flex:1;max-width:1020px;width:100%;margin:0 auto;padding:26px 22px 90px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(16,42,67,.15);padding:26px 30px;margin-bottom:18px}
.partlabel{font-size:13px;color:#5b6b7b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
h1{font-size:26px;color:#123c6d;margin-bottom:10px}
h2{font-size:21px;color:#123c6d;margin-bottom:8px}
h3{font-size:16px;color:#123c6d;margin:14px 0 6px}
.qtype-head{border-bottom:1px solid #dde4ea;padding-bottom:12px;margin-bottom:16px}
.qtype-head .qtitle{font-size:19px;font-weight:600;color:#123c6d}
.qtype-head .qpos{font-size:13px;color:#5b6b7b;float:right}
.instructions{color:#3d4f60;margin:6px 0 14px;font-size:15px}
.promptbox{background:#f2f6fa;border:1px solid #d5e0ea;border-radius:6px;padding:16px 20px;margin:12px 0;font-size:17px}
.figbox{background:#fff;border:1px solid #d5e0ea;border-radius:6px;padding:14px;margin:12px 0;text-align:center}
.figbox svg{max-width:100%;height:auto}
.mono{font-family:Consolas,monospace;font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-block;border:none;border-radius:5px;padding:10px 26px;font-size:15px;font-weight:600;background:#123c6d;color:#fff}
.btn:hover{background:#0d3058}
.btn:disabled{background:#9fb2c3;cursor:not-allowed}
.btn.sec{background:#fff;color:#123c6d;border:1px solid #123c6d}
.btn.sec:hover{background:#eef3f8}
.btn.warn{background:#b3261e}
.btn.small{padding:5px 14px;font-size:13px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.modewrap{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0}
.modecard{flex:1;min-width:260px;border:2px solid #d5e0ea;border-radius:8px;padding:20px 22px;cursor:pointer;background:#fff}
.modecard:hover{border-color:#41b6e6}
.modecard h3{margin-top:0}
.modecard ul{margin:8px 0 0 18px;font-size:14px;color:#3d4f60}

/* ---------- status / recording ---------- */
.statusbar{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.statusline{font-weight:600;color:#123c6d}
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c4cdd6}
.recdot.on{background:#e02424;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.audbar{flex:1;min-width:180px;height:8px;background:#dde4ea;border-radius:4px;overflow:hidden}
.audbar>div{height:100%;background:#41b6e6;width:0}
.audbar.rec>div{background:#e02424}
.timechip{font-variant-numeric:tabular-nums;font-weight:600;color:#123c6d;background:#eef3f8;border-radius:5px;padding:4px 12px}

/* ---------- guide tips ---------- */
.tipsbox{background:#fff8e6;border:1px solid #e8cf8a;border-left:5px solid #e0a800;border-radius:6px;padding:14px 18px;margin:14px 0;font-size:14px}
.tipsbox h4{color:#7a5800;margin-bottom:6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.tipsbox ul{margin-left:18px}
.tipsbox li{margin:3px 0}
.samplebox{background:#eafaf0;border:1px solid #9edbb4;border-radius:6px;padding:14px 18px;margin:12px 0;font-size:14.5px}
.samplebox h4{color:#166534;margin-bottom:6px;font-size:14px}

/* ---------- inputs ---------- */
textarea{width:100%;border:1px solid #b9c6d2;border-radius:6px;padding:12px;font-family:inherit;font-size:16px;line-height:1.6;resize:vertical}
textarea:focus{outline:2px solid #41b6e6}
input[type=text]{border:1px solid #b9c6d2;border-radius:5px;padding:8px 10px;font-size:15px;font-family:inherit}
input[type=text]:focus{outline:2px solid #41b6e6}
.wordcount{font-size:13px;color:#5b6b7b;margin-top:6px}
.wordcount.bad{color:#b3261e;font-weight:600}
select{border:1px solid #8fa4b8;border-radius:4px;padding:3px 6px;font-size:15px;background:#eef3f8;margin:0 2px}
.optrow{display:block;padding:9px 12px;border:1px solid #d5e0ea;border-radius:6px;margin:7px 0;cursor:pointer}
.optrow:hover{background:#f2f6fa}
.optrow.sel{border-color:#123c6d;background:#eaf3fb}
.optrow input{margin-right:9px}

/* ---------- reading layout ---------- */
.readwrap{display:flex;gap:18px}
.readnav{width:170px;flex-shrink:0}
.readnav button{display:block;width:100%;text-align:left;margin-bottom:5px;padding:7px 10px;border:1px solid #d5e0ea;background:#fff;border-radius:5px;font-size:13px}
.readnav button.cur{border-color:#123c6d;background:#eaf3fb;font-weight:600}
.readnav button.done::after{content:" ✓";color:#1a7f37}
.readmain{flex:1;min-width:0}
@media(max-width:760px){.readwrap{flex-direction:column}.readnav{width:100%;display:flex;flex-wrap:wrap}.readnav button{width:auto}}

/* ---------- drag blanks ---------- */
.fibbank{border:1px dashed #8fa4b8;border-radius:6px;padding:10px;margin:12px 0;min-height:48px}
.chip{display:inline-block;background:#123c6d;color:#fff;border-radius:4px;padding:5px 13px;margin:4px;cursor:pointer;font-size:14px;user-select:none}
.chip.used{opacity:.3;pointer-events:none}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid #123c6d;padding:2px 8px;margin:0 3px;text-align:center;cursor:pointer;color:#123c6d;font-weight:600;background:#eef3f8;border-radius:4px 4px 0 0}
.blank:empty::before{content:"\\200b"}

/* ---------- reorder ---------- */
.reitem{border:1px solid #d5e0ea;border-radius:6px;background:#fff;padding:11px 14px;margin:6px 0;display:flex;align-items:center;gap:10px}
.reitem .mv{display:flex;flex-direction:column;gap:2px}
.reitem .mv button{border:1px solid #b9c6d2;background:#f2f6fa;border-radius:4px;font-size:11px;padding:1px 8px;line-height:1.4}
.reitem .txt{flex:1}

/* ---------- HIW ---------- */
.hiw-word{cursor:pointer;padding:1px 2px;border-radius:3px}
.hiw-word:hover{background:#ffe9a8}
.hiw-word.sel{background:#f9c74f;color:#5b4300;font-weight:600}

/* ---------- review ---------- */
.scorebig{font-size:34px;font-weight:700;color:#123c6d}
.revitem{border:1px solid #dde4ea;border-radius:6px;padding:14px 18px;margin:10px 0;background:#fff}
.revitem h4{color:#123c6d;font-size:15px;margin-bottom:6px}
.revitem .ok{color:#1a7f37;font-weight:600}
.revitem .no{color:#b3261e;font-weight:600}
.revitem .ua{background:#f2f6fa;border-radius:4px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.badge{display:inline-block;font-size:12px;border-radius:9px;padding:1px 10px;margin-left:8px}
.badge.ok{background:#d9f2e3;color:#1a7f37}
.badge.no{background:#fadbd8;color:#b3261e}
.badge.na{background:#e8ecf1;color:#5b6b7b}
audio{display:block;margin:8px 0;max-width:100%}
.kv{font-size:14px;color:#3d4f60;margin:4px 0}

.footer-note{max-width:1020px;margin:0 auto;padding:12px 22px 30px;font-size:12.5px;color:#77879a}

</style>
</head>

<div id="app"></div>
<script>
const EXAM = {"meta":{"id":2,"title":"PTE Academic Mock Exam 2 (2026 Format)"},"readAloud":[{"text":"Artificial intelligence is rapidly changing the way scientific research is conducted. Machine learning systems can analyse enormous datasets in hours, identifying patterns that would take human researchers years to discover. In medicine, these systems already help doctors detect diseases earlier and design new drugs. Nevertheless, experts caution that human judgement remains essential for interpreting results and making ethical decisions."},{"text":"Every year, an estimated eleven million tonnes of plastic waste enter the world's oceans. Rivers carry discarded packaging, bottles, and fishing gear from the land to the sea, where sunlight and waves slowly break them into microscopic fragments. These microplastics have now been found everywhere from the deepest ocean trenches to Arctic sea ice, and their long-term effects on marine life remain poorly understood."},{"text":"Electric aviation promises to transform regional air travel over the coming decades. Battery-powered aircraft produce no emissions during flight and are far quieter than conventional planes, which could allow airports to operate longer hours without disturbing nearby residents. The main obstacle is battery weight: current technology limits electric planes to short routes with few passengers, but engineers expect steady improvements."},{"text":"The fashion industry produces more clothing than ever before, yet the average garment is worn fewer times. Fast fashion brands release new styles weekly, encouraging consumers to treat clothing as disposable. This model consumes vast quantities of water, generates enormous textile waste, and accounts for a significant share of global carbon emissions. Campaigners argue that both companies and consumers must rethink their relationship with clothing."},{"text":"Populations are ageing rapidly across much of the developed world. As birth rates fall and life expectancy rises, the proportion of citizens over sixty-five continues to grow. This demographic shift places considerable pressure on pension systems, healthcare services, and the labour market. Governments are responding with measures such as raising retirement ages, encouraging older workers to remain employed, and cautiously expanding immigration."},{"text":"Museums have undergone a quiet revolution in recent decades. Once regarded as dusty storehouses of artefacts, they now compete to offer interactive exhibitions, digital archives, and educational programmes for schools. Many institutions have also begun to confront uncomfortable questions about how their collections were acquired, and several prominent museums have returned objects to the communities from which they were originally taken."},{"text":"Fresh water covers only a tiny fraction of the planet's surface, yet demand for it continues to rise. Agriculture consumes roughly seventy percent of global freshwater supplies, and inefficient irrigation wastes much of it. Meanwhile, climate change is altering rainfall patterns, leaving some regions with too little water and others with destructive floods. Experts warn that water scarcity could become one of the defining crises of this century."}],"repeatSentence":[{"text":"The seminar on artificial intelligence has been moved to the main auditorium."},{"text":"Please return your borrowed equipment to the laboratory before Thursday evening."},{"text":"Tuition fees for international students will rise by five percent next year."},{"text":"The campus bus runs every fifteen minutes during the examination period."},{"text":"Professor Lane's office hours are cancelled this week because of the conference."},{"text":"You need at least three references for the final research project."},{"text":"The new student centre opens beside the sports hall next month."},{"text":"Electric scooters are not permitted inside any of the university buildings."},{"text":"Many graduates find their first jobs through the university career fair."},{"text":"The deadline for scholarship applications falls at the end of March."}],"describeImage":[{"title":"Electric cars as a share of new car sales (%)","sample":"The bar chart shows the percentage of new car sales that are electric in four countries. Norway is by far the leader, with electric vehicles making up around eighty percent of new sales. Germany follows at approximately eighteen percent, while the United States is much lower, at about eight percent. Japan has the smallest share, at only three percent. Overall, the chart shows that electric car adoption varies enormously between countries, with Norway far ahead of the others.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><line x1='60' y1='260' x2='500' y2='260' stroke='#333'/><line x1='60' y1='20' x2='60' y2='260' stroke='#333'/><text x='30' y='265' font-size='11'>0<\/text><text x='22' y='217' font-size='11'>20<\/text><text x='22' y='169' font-size='11'>40<\/text><text x='22' y='121' font-size='11'>60<\/text><text x='22' y='73' font-size='11'>80<\/text><rect x='90' y='68' width='70' height='192' fill='#4f9d69'/><rect x='190' y='217' width='70' height='43' fill='#4f9d69'/><rect x='290' y='241' width='70' height='19' fill='#4f9d69'/><rect x='390' y='253' width='70' height='7' fill='#4f9d69'/><text x='100' y='278' font-size='12'>Norway<\/text><text x='196' y='278' font-size='12'>Germany<\/text><text x='308' y='278' font-size='12'>USA<\/text><text x='408' y='278' font-size='12'>Japan<\/text><\/svg>"},{"title":"Plastic waste entering the ocean, 2010–2030 (million tonnes per year)","sample":"The line graph shows the amount of plastic waste entering the ocean each year from 2010, with projections to 2030. In 2010 the figure was about eight million tonnes. It rose gradually to around eleven million tonnes in 2020 and is expected to continue climbing, reaching roughly fourteen million tonnes by 2030. Although the growth rate slows slightly after 2025, the overall trend is clearly upward, indicating that ocean plastic pollution is still getting worse.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><line x1='60' y1='260' x2='500' y2='260' stroke='#333'/><line x1='60' y1='20' x2='60' y2='260' stroke='#333'/><text x='30' y='265' font-size='11'>0<\/text><text x='24' y='205' font-size='11'>4<\/text><text x='24' y='145' font-size='11'>8<\/text><text x='20' y='85' font-size='11'>12<\/text><text x='20' y='25' font-size='11'>16<\/text><polyline points='80,140 180,125 280,95 380,80 480,50' fill='none' stroke='#2f6db3' stroke-width='3'/><circle cx='80' cy='140' r='4' fill='#2f6db3'/><circle cx='280' cy='95' r='4' fill='#2f6db3'/><circle cx='480' cy='50' r='4' fill='#2f6db3'/><text x='70' y='278' font-size='11'>2010<\/text><text x='270' y='278' font-size='11'>2020<\/text><text x='468' y='278' font-size='11'>2030<\/text><\/svg>"},{"title":"Global freshwater use by sector","sample":"The pie chart illustrates how the world's freshwater is divided between three sectors. Agriculture dominates completely, accounting for seventy percent of all freshwater use, mainly for irrigation. Industry is the second largest user, at twenty percent, which includes manufacturing and power generation. Domestic use, meaning water consumed in homes for drinking, cooking, and washing, makes up only ten percent. In conclusion, farming uses far more freshwater than industry and households combined.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><circle cx='180' cy='150' r='110' fill='#2f6db3'/><path d='M180,150 L180,40 A110,110 0 0 1 285,116 Z' fill='#e8a13d'/><path d='M180,150 L285,116 A110,110 0 0 1 285,184 Z' fill='#4f9d69'/><text x='330' y='100' font-size='12' fill='#2f6db3'>■ Agriculture 70%<\/text><text x='330' y='130' font-size='12' fill='#e8a13d'>■ Industry 20%<\/text><text x='330' y='160' font-size='12' fill='#4f9d69'>■ Domestic 10%<\/text><\/svg>"}],"retellLecture":[{"title":"The business of space tourism","sample":"The lecture described how space tourism developed from one expensive private trip in 2001 into a growing commercial industry. The speaker explained that companies now offer short suborbital flights and predicted that ticket prices will fall as rockets become reusable, just as airfares once did. However, the lecture also noted major obstacles, including safety concerns, the environmental impact of launches, and the huge cost of building vehicles that can reach orbit.","text":"Space tourism has shifted from science fiction to a genuine industry in a remarkably short time. The first private passenger paid twenty million dollars for a trip to the International Space Station in 2001. Two decades later, several companies began offering suborbital flights that give passengers a few minutes of weightlessness and a view of the Earth's curve, for a fraction of that price. Industry analysts predict that ticket costs will continue to fall as rockets become reusable, much as airfares dropped in the early days of aviation. Nevertheless, significant obstacles remain, including safety concerns, the environmental impact of launches, and the enormous cost of building larger vehicles capable of reaching orbit."},{"title":"Gene editing and its promise","sample":"The lecturer introduced CRISPR, a cheap and precise gene-editing tool originally borrowed from bacteria. The speaker listed its main applications, including curing inherited diseases, creating drought-resistant crops, and fighting malaria, and mentioned the first approved CRISPR therapy in 2023. Finally, the lecture warned that editing embryos raises serious ethical questions because the changes pass to future generations, so most scientists support strict limits on the technology.","text":"Few technologies have excited biologists as much as CRISPR, a gene-editing tool adapted from a defence system found in bacteria. CRISPR allows researchers to cut DNA at precise locations and rewrite the genetic code, at a fraction of the cost of earlier methods. Its potential applications are enormous: correcting inherited diseases, engineering crops that survive drought, and eliminating the mosquitoes that spread malaria. The first CRISPR-based therapy, for sickle-cell disease, was approved in 2023 and has already transformed patients' lives. Yet the technology raises difficult questions. Editing embryos would create changes that pass to future generations, and a scientist who did exactly that in 2018 was imprisoned. Most researchers therefore support strict limits on how far gene editing should go."}],"respondToSituation":[{"prompt":"You share a flat with another student. Your flatmate keeps leaving the heating and lights on all day, and your electricity bill has doubled. Talk to your flatmate about the problem. What would you say?","audio":"You share a flat with another student. Your flatmate keeps leaving the heating and lights on all day, and your electricity bill has doubled. Talk to your flatmate about the problem. What would you say?","sample":"Hey, can I talk to you about the electricity bill? It arrived this morning and it's nearly double what we normally pay. I think it's because the heating's been left on all day when nobody's home, and the kitchen lights stay on overnight. I know you're not doing it on purpose, but I honestly can't afford this on my student budget. Could we agree to turn the heating off whenever we go out, and maybe check the lights before bed? If it helps, I can put little reminder notes by the switches. I really don't want this to become a problem between us — I just need us both to be a bit more careful. Thanks for understanding."},{"prompt":"You are part of a group of four students preparing a presentation. One member has missed every meeting and has not replied to messages. The presentation is next week. Talk to that group member. What would you say?","audio":"You are part of a group of four students preparing a presentation. One member has missed every meeting and has not replied to messages. The presentation is next week. Talk to that group member. What would you say?","sample":"Hi, thanks for meeting me. Look, I'm a bit worried about the group presentation. You've missed the last three meetings and we haven't heard back from you, so we weren't sure if you're still doing the project. If something's going on, that's completely fine — just tell us and we can work around it. But the presentation is next Thursday, and your section on the survey results still isn't started. We really need you to send us your slides by Sunday so we can rehearse together on Monday. Can you commit to that? And if you can't, please be honest with me now, and we'll divide your part between the rest of us. I just don't want anyone to fail because of a communication problem."}],"summarizeGroupDiscussion":[{"topic":"Should lectures be recorded and attendance made optional?","sample":"The group discussed whether recorded lectures should make attendance optional. Speaker A supported recordings because they help students with jobs, illness, or weaker English, and believed attendance should not be compulsory. Speaker B warned that recordings lead to empty lecture halls and weaker discussion, proposing participation incentives such as in-class quizzes. Speaker C cited research suggesting students use recordings mainly for revision and suggested a compromise: record everything, keep attendance optional, but build interactive elements into lectures. The speakers broadly converged on this middle position.","turns":[{"speaker":"A","text":"I think recording lectures is obviously a good thing. Students who are ill, or who have jobs or caring responsibilities, shouldn't be penalised. If the lecture is online, attendance shouldn't be compulsory."},{"speaker":"B","text":"I disagree. The moment recordings go online, half the class stops turning up. Discussion dies, and lecturers end up talking to an empty room. Learning is a social activity, not just content delivery."},{"speaker":"C","text":"Both of you have a point, but the research I've seen says recordings are mainly used for revision before exams, not as a substitute for attending. Students still come when the lecture is engaging."},{"speaker":"A","text":"Exactly. And for students whose first language isn't English, being able to replay difficult sections is a huge help."},{"speaker":"B","text":"That's true, but I'd still keep some kind of participation requirement, maybe in-class quizzes, so there's an incentive to attend."},{"speaker":"C","text":"So maybe the compromise is: record everything, keep attendance optional, but build interactive elements into lectures so people actually want to be there."}]},{"topic":"The student union is considering banning smartphones during seminars. Discuss.","sample":"The students debated banning smartphones in seminars. Speaker A supported the ban, arguing that phones are disrespectful to tutors and damage group discussion. Speaker B opposed a total ban as heavy-handed, pointing out that phones are useful for looking up terms and taking notes. Speaker C proposed distinguishing seminars from lectures and suggested a shared 'phones face down' norm rather than a formal ban. In the end, all three agreed that seminars should be phone-free, with exceptions for accessibility needs, while lectures should remain unrestricted.","turns":[{"speaker":"A","text":"Honestly, I'd support a ban. In my seminars, half the people are scrolling under the table. It's disrespectful to the tutor and it ruins the discussion for everyone else."},{"speaker":"B","text":"I get that, but a total ban feels heavy-handed. I use my phone to look up terms I don't understand and to take notes. Treating adults like schoolchildren isn't the answer."},{"speaker":"C","text":"Could we distinguish between lectures and seminars? In a seminar you need to be fully present, so maybe phones away makes sense there. In lectures, let people manage their own attention."},{"speaker":"A","text":"That's reasonable. It's really the small-group discussions that suffer."},{"speaker":"B","text":"I'd accept that, as long as there are exceptions for accessibility needs and note-taking apps."},{"speaker":"C","text":"Agreed. We could suggest a 'phones face down' policy for seminars rather than a formal ban, so it feels like a shared norm instead of a punishment."}]}],"answerShortQuestion":[{"question":"What do you call a scientist who studies human history through ancient objects and ruins?","answer":"An archaeologist"},{"question":"How many years are there in a decade?","answer":"Ten"},{"question":"What is the solid, frozen form of water called?","answer":"Ice"},{"question":"What instrument tells a pilot how high above the ground an aircraft is flying?","answer":"An altimeter"},{"question":"What is the official document that lists all the courses a student has completed and their grades?","answer":"A transcript"}],"summarizeWrittenText":[{"passage":"Space tourism moved from fantasy to reality in the early 2020s, when private companies began flying paying passengers to the edge of space. Tickets cost hundreds of thousands of dollars, putting the experience far beyond the reach of ordinary people. Supporters argue that the industry drives technological innovation and that prices will fall as the technology matures, just as air travel became affordable over the course of the twentieth century. Critics counter that rocket launches release carbon emissions and black carbon high in the atmosphere, where their warming effect is strongest, and they question the value of spending billions on brief joyrides while pressing problems remain unsolved on Earth. Whether space tourism becomes a mature mass-market industry or remains an expensive novelty will depend on how quickly these economic and environmental challenges can be overcome.","sample":"Space tourism has become a commercial reality that supporters believe will drive innovation and eventually become affordable like air travel, but critics object that its high-altitude emissions worsen climate change and that the money would be better spent on Earth's problems, so its future depends on overcoming economic and environmental obstacles."},{"passage":"Roughly one third of all food produced for human consumption is never eaten, an astonishing failure in a world where hundreds of millions of people still go hungry. The causes of this waste differ sharply between rich and poor countries. In developing nations, food is lost mainly after harvest, because of inadequate storage, poor roads, and a lack of refrigeration between farm and market. In wealthy nations, by contrast, most waste occurs in supermarkets and homes, where consumers buy more than they need and confusion over date labels leads people to discard food that is perfectly safe. The environmental consequences are severe: food rotting in landfills releases methane, and food waste alone accounts for around eight percent of global greenhouse gas emissions. Researchers therefore argue that reducing waste is among the cheapest and fastest ways to cut emissions and improve food security at the same time.","sample":"A third of all food is wasted for different reasons in rich and poor countries — poor storage and transport in developing nations versus overbuying and date-label confusion in wealthy ones — and because this waste causes hunger and significant methane emissions, reducing it is considered one of the cheapest ways to cut emissions and improve food security."}],"essay":[{"prompt":"Some people believe that artificial intelligence and automation will create more jobs than they destroy, while others argue they pose a serious threat to employment. Discuss both views and give your own opinion. Write 200–300 words.","sample":"Possible structure: (1) Introduction — paraphrase the debate, state your position. (2) Optimist view: past technologies created new industries, AI removes boring tasks and creates roles in data, maintenance and design, higher productivity raises living standards. (3) Pessimist view: automation now threatens white-collar as well as manual jobs, new roles require skills displaced workers lack, transition may be painful and unequal. (4) Conclusion — your view, e.g. jobs will change more than disappear, but governments must invest in retraining. Useful phrases: 'It is often argued that…', 'A compelling argument is…', 'On the other hand…', 'History suggests that…', 'In conclusion, I believe…'"}],"reading":{"fibDropdown":[{"text":"Electric car sales have grown rapidly, driven by government {{1}} and falling battery costs. Norway {{2}} the world, with electric models {{3}} for the majority of new registrations. However, many countries still lack the charging {{4}} needed to support mass adoption.","blanks":[{"options":["subsidies","substances","subtitles","substitutes"],"correct":0},{"options":["leads","follows","lags","avoids"],"correct":0},{"options":["responsible","accounting","answering","caring"],"correct":1},{"options":["furnishings","infrastructure","institutions","instructions"],"correct":1}]},{"text":"Museums are no longer simply places where objects are {{1}} behind glass. Many now offer interactive exhibits that {{2}} visitors to touch replicas and take part in workshops. Digital technology has also {{3}} museums to reach global audiences through virtual tours. Critics, {{4}}, argue that nothing can replace the experience of standing before an original artefact.","blanks":[{"options":["displayed","disturbed","dissolved","dismissed"],"correct":0},{"options":["encourage","enforce","escape","exclude"],"correct":0},{"options":["prevented","enabled","promised","refused"],"correct":1},{"options":["therefore","moreover","however","furthermore"],"correct":2}]},{"text":"The gene-editing tool CRISPR allows scientists to {{1}} specific sections of DNA with remarkable precision. Researchers hope it will one day {{2}} inherited diseases such as sickle-cell anaemia. Early clinical trials have produced {{3}} results, but many scientists urge caution. Editing genes that pass to future generations {{4}} profound ethical questions that society has yet to answer.","blanks":[{"options":["alter","adore","alarm","allege"],"correct":0},{"options":["cause","cure","create","catch"],"correct":1},{"options":["disappointing","confusing","promising","amusing"],"correct":2},{"options":["raises","rises","arises","arouses"],"correct":0}]},{"text":"Fast fashion produces cheap clothing that copies the latest styles, but its environmental {{1}} is enormous. The industry consumes vast quantities of water and is {{2}} for around ten percent of global carbon emissions. Most garments are worn only a few times before being {{3}}. Campaigners urge consumers to buy fewer clothes of better {{4}}.","blanks":[{"options":["cost","price","value","cheque"],"correct":0},{"options":["responsible","famous","grateful","ready"],"correct":0},{"options":["discarded","discovered","disguised","displayed"],"correct":0},{"options":["price","quality","colour","quantity"],"correct":1}]},{"text":"Telemedicine allows patients to {{1}} doctors by video call rather than travelling to a clinic. This is especially valuable in rural areas, where medical specialists are often {{2}}. Studies show that remote consultations work well for routine {{3}} such as prescription renewals. However, conditions requiring physical {{4}} must still be handled in person.","blanks":[{"options":["consult","construct","consume","contain"],"correct":0},{"options":["abundant","scarce","wealthy","eager"],"correct":1},{"options":["matters","miracles","markets","machines"],"correct":0},{"options":["education","celebration","examination","imagination"],"correct":2}]}],"mcMultiple":[{"passage":"Commercial space tourism moved from fantasy to reality in the early 2020s, when private companies began flying paying passengers to the edge of space. Tickets cost hundreds of thousands of dollars, putting the experience far beyond the reach of ordinary people. Supporters argue that the industry drives innovation and that prices will fall as the technology matures, just as air travel did a century ago. Critics counter that rocket launches release carbon emissions and black carbon high in the atmosphere, where their warming effect is strongest. They also question the value of spending billions on brief joyrides while pressing problems remain unsolved on Earth.","question":"Which of the following points are made in the passage?","options":["Space tourism flights are currently affordable only for the wealthy","Ticket prices have already fallen to the level of commercial airfares","Rocket launches release pollutants high in the atmosphere","Supporters expect prices to decrease as the technology develops","Most space tourists spend several weeks in orbit"],"answers":[0,2,3]},{"passage":"Cities around the world are experimenting with free public transport. The Estonian capital Tallinn introduced free fares for residents in 2013, and Luxembourg became the first country to make all public transport free in 2020. Advocates claim the policy cuts congestion, reduces pollution, and helps low-income households. Yet the evidence is mixed. In Tallinn, car use fell only slightly, and much of the increase in ridership came from people who had previously walked or cycled. Critics also note that the policy is expensive to maintain and that the money might deliver greater benefits if it were invested in more frequent services and new routes instead.","question":"According to the passage, which statements about free public transport are correct?","options":["Luxembourg was the first country to offer nationwide free public transport","In Tallinn, car use dropped dramatically after fares were removed","Some of Tallinn's new passengers previously travelled on foot or by bicycle","Critics believe the funds might be better spent on improving services","Free fares have eliminated traffic congestion in Tallinn"],"answers":[0,2,3]}],"reorder":[{"sentences":["The Great Pacific Garbage Patch is a vast area of ocean where plastic waste accumulates.","Ocean currents carry debris from coastlines and concentrate it in rotating systems known as gyres.","Over time, sunlight and waves break this plastic into tiny fragments called microplastics.","These particles are easily swallowed by marine animals and can enter the human food chain."]},{"sentences":["Electric aircraft could dramatically reduce the environmental impact of short flights.","Several companies are already testing small battery-powered planes on regional routes.","Because batteries are heavy, current designs can carry only a few passengers over short distances.","Engineers believe that improved battery technology will greatly extend their range within two decades."]}],"fibDrag":[{"text":"Water scarcity now affects over two billion people worldwide. Climate change is making droughts more {{1}}, while growing populations increase {{2}} for limited supplies.","answers":["frequent","demand"],"bank":["frequent","demand","gentle","supply","rarely","massive"]},{"text":"Museums increasingly digitise their collections so that researchers can study objects {{1}}. High-resolution scans reveal details that are invisible to the {{2}} eye.","answers":["remotely","naked"],"bank":["remotely","naked","loudly","formal","distant","polished"]},{"text":"Food waste is a growing problem: roughly a third of all food produced is never {{1}}. Supermarkets often reject fruit and vegetables simply because of their {{2}} appearance.","answers":["eaten","unusual"],"bank":["eaten","unusual","painted","typical","frozen","loudly"]},{"text":"Social media platforms are designed to capture and hold users' {{1}}. Features such as endless scrolling and notifications {{2}} people to check their phones repeatedly throughout the day.","answers":["attention","encourage"],"bank":["attention","encourage","payment","discourage","silence","weekly"]}],"mcSingle":[{"passage":"Japan has the oldest population of any major nation, with nearly thirty percent of its citizens aged sixty-five or over. A shrinking workforce must support a growing number of retirees, straining pension systems and healthcare budgets. The government has responded by raising the retirement age, encouraging women and elderly people to remain in work, and cautiously expanding immigration. Other countries, including Italy, Germany, and South Korea, are following the same demographic path and are watching Japan's policies closely for lessons.","question":"Which statement best captures the main point of the text?","options":["Japan's population is growing faster than that of any other nation","Japan is adapting to an ageing population through a range of policy measures","Immigration has completely solved Japan's labour shortage","Japan's pension system is the most generous in the world"],"answer":1},{"passage":"Noise pollution is an under-recognised threat to human health. The World Health Organization links long-term exposure to traffic noise with increased risks of heart disease, sleep disturbance, and impaired learning in children. Studies suggest that one in five Europeans is exposed to noise at harmful levels. Unlike air pollution, however, noise leaves no visible trace, which may explain why regulations remain weak. Some cities are now introducing low-noise road surfaces, designated quiet zones, and stricter limits on night-time construction.","question":"According to the passage, why is noise pollution poorly regulated?","options":["Because it causes no measurable health effects","Because it is invisible and therefore easy to overlook","Because governments consider it too expensive to measure","Because existing regulations are already too strict"],"answer":1}]},"listening":{"summarizeSpokenText":[{"title":"The economics of food waste","sample":"The speaker explained that around a billion tonnes of food is wasted every year while many people go hungry. The causes differ: poor countries lose food after harvest because of bad storage and transport, while wealthy countries waste food in shops and homes due to overbuying and confusing date labels. The lecture concluded that food waste causes significant methane emissions, so reducing it is a cheap and fast way to cut emissions and improve food security.","audio":"Every year, humanity throws away roughly one billion tonnes of food, while hundreds of millions of people go hungry. The causes differ between rich and poor countries. In developing nations, food is mainly lost after harvest, because of poor storage, bad roads, and a lack of refrigeration. In wealthy nations, most waste happens in shops and homes, where consumers buy more than they need, and confusion over date labels leads people to discard food that is still safe. The environmental cost is staggering: rotting food in landfills produces methane, and food waste alone accounts for around eight percent of global emissions. Researchers argue that reducing waste is one of the cheapest and quickest ways to cut emissions and improve food security."},{"title":"How AI is changing medical diagnosis","sample":"The lecture described how artificial intelligence is transforming medical diagnosis, especially in image-based fields, where algorithms can detect cancers, eye diseases, and fractures as accurately as specialists. However, the speaker warned that algorithms trained on unrepresentative data perform worse for certain patient groups. The conclusion was that AI will act as a second reader supporting doctors rather than replacing them.","audio":"Artificial intelligence is beginning to transform medical diagnosis, particularly in fields that depend on interpreting images. Algorithms trained on millions of scans can now detect certain cancers, eye diseases, and fractures with an accuracy that matches, and sometimes exceeds, that of experienced specialists. In one trial, an algorithm reviewing mammograms reduced both missed cancers and false alarms. However, researchers stress important limitations. Algorithms learn from historical data, and if that data underrepresents certain groups, the system's accuracy falls for those patients. Most experts therefore believe AI will not replace doctors. Instead, it will act as a second reader, flagging suspicious cases and freeing specialists to focus on complex diagnoses and patient care."}],"mcMultiple":[{"audio":"This week the engineering faculty would like to remind all students that the design studio will be closed on Thursday for equipment upgrades. The 3D printers will be unavailable until Friday morning. Also, please note that the guest lecture on electric aircraft has been moved from Wednesday to Friday at two o'clock in the main lecture hall. Attendance counts towards your professional development credits. Finally, the deadline for submitting your group project proposals has been extended to Sunday at midnight, following requests from several project teams.","question":"Which of the statements below are correct, according to the recording?","options":["The design studio will be closed on Thursday","The guest lecture has been cancelled","The guest lecture will take place in the main lecture hall","Project proposals are now due on Sunday at midnight","The 3D printers will be unavailable for the whole week"],"answers":[0,2,3]}],"fillBlanks":[{"display":"Water scarcity is no longer a problem limited to desert regions. Many major cities now face regular {{1}} during the summer months. Experts recommend fixing leaking pipes, reusing {{2}} water, and charging prices that reflect the true {{3}} of supply.","answers":["shortages","grey","cost"],"audio":"Water scarcity is no longer a problem limited to desert regions. Many major cities now face regular shortages during the summer months. Experts recommend fixing leaking pipes, reusing grey water, and charging prices that reflect the true cost of supply."},{"display":"The exhibition traces how {{1}} navigation relied on the stars before modern instruments. Sailors measured the angle of the sun at {{2}} to estimate their position at sea, a method that required clear {{3}} and considerable skill.","answers":["early","noon","skies"],"audio":"The exhibition traces how early navigation relied on the stars before modern instruments. Sailors measured the angle of the sun at noon to estimate their position at sea, a method that required clear skies and considerable skill."},{"display":"To register for the conference, please complete the online {{1}} and pay the reduced student {{2}} before the end of the month. Confirmation will be sent to your university {{3}} within two working days.","answers":["form","fee","address"],"audio":"To register for the conference, please complete the online form and pay the reduced student fee before the end of the month. Confirmation will be sent to your university address within two working days."}],"highlightCorrectSummary":[{"audio":"Parents often blame social media for teenagers' unhappiness, but recent research paints a more complicated picture. Large studies find only a small statistical link between screen time and depression. What seems to matter far more is how the platforms are used. Teenagers who passively scroll through other people's photos report lower mood, while those who use social media to message close friends often feel more connected. Sleep also plays a crucial role: heavy late-night use disrupts sleep, and it is this lost sleep, rather than screen time itself, that best predicts poor mental health. Researchers therefore advise focusing on habits, not blanket bans.","options":["Social media is the main cause of teenage depression, and banning it completely would solve the problem.","The effect of social media depends on how teenagers use it, and lost sleep appears to be a key mechanism behind mental health problems.","Passively scrolling through photos improves teenagers' mood because it provides social connection.","Screen time has no connection whatsoever to teenagers' mental health or sleep."],"answer":1}],"mcSingle":[{"audio":"Excuse me, I'm trying to find the health sciences building. I've got an appointment at the student clinic at half past ten for a vaccination. The campus map says it's somewhere near the sports centre, but I've walked around the whole block twice and I still can't find the entrance.","question":"Why is the speaker asking for help?","options":["She wants to cancel her vaccination appointment","She cannot locate the student clinic","She is looking for the campus map office","She needs to register at the sports centre"],"answer":1}],"selectMissingWord":[{"audio":"Recycling alone cannot solve the plastic crisis. The world produces over four hundred million tonnes of plastic each year, and less than ten percent of it is ever recycled. Most experts now agree that the only real solution is to produce less plastic in the first","options":["place","wave","decade","country"],"answer":0,"fullText":"Most experts now agree that the only real solution is to produce less plastic in the first place."}],"highlightIncorrectWords":[{"words":[{"w":"Electric"},{"w":"aircraft"},{"w":"are"},{"w":"quicker","wrong":true,"said":"quieter"},{"w":"than"},{"w":"conventional"},{"w":"planes"},{"w":"because"},{"w":"electric"},{"w":"motors"},{"w":"produce"},{"w":"far"},{"w":"less"},{"w":"vibration."},{"w":"Airlines"},{"w":"hope"},{"w":"this"},{"w":"will"},{"w":"allow"},{"w":"more"},{"w":"morning","wrong":true,"said":"night"},{"w":"flights"},{"w":"without"},{"w":"disrupting","wrong":true,"said":"disturbing"},{"w":"communities"},{"w":"near"},{"w":"airports."}]},{"words":[{"w":"Food"},{"w":"delivery"},{"w":"apps"},{"w":"have"},{"w":"changed"},{"w":"cooking","wrong":true,"said":"eating"},{"w":"habits"},{"w":"in"},{"w":"cities."},{"w":"Workers"},{"w":"who"},{"w":"once"},{"w":"waited","wrong":true,"said":"queued"},{"w":"at"},{"w":"sandwich"},{"w":"shops"},{"w":"now"},{"w":"order"},{"w":"cold","wrong":true,"said":"hot"},{"w":"meals"},{"w":"to"},{"w":"their"},{"w":"desks"},{"w":"instead."}]}],"writeFromDictation":[{"text":"The research findings will be published in a scientific journal."},{"text":"Attendance at laboratory sessions is compulsory for all medical students."},{"text":"Water shortages affect agriculture more than any other industry."}]}};

/* ================= static text: instructions + guide tips ================= */
var TYPE_META = {
  readAloud: { title: "Read Aloud", part: 1,

    tips: ["Use the 35s prep to read silently twice; mark hard words.", "Stress content words (nouns, verbs), glide over function words.", "Fall in intonation at full stops, rise at commas.", "Never go back to correct a mistake — keep flowing.", "Steady natural pace beats fast reading."] },
  repeatSentence: { title: "Repeat Sentence", part: 1,

  describeImage: { title: "Describe Image", part: 1,

  retellLecture: { title: "Re-tell Lecture", part: 1,

  respondToSituation: { title: "Respond to a Situation", part: 1,

  summarizeGroupDiscussion: { title: "Summarize Group Discussion", part: 1,

    tips: ["Note each speaker's MAIN point + any agreement/disagreement between them.", "Frame: 'The speakers discussed… The first speaker argued… while the second believed… They agreed that…'", "Cover ALL speakers, not just one.", "Use reporting verbs: suggested, objected, agreed, proposed."] },
  answerShortQuestion: { title: "Answer Short Question", part: 1,
    ins: "You will hear a question. Please give a simple and short answer. Often just one or a few words is enough. You will hear the question only once.",
    tips: ["Answer with one or a few words — never a full sentence.", "Listen for the wh-word (who/where/what) to predict answer type.", "Tests general knowledge + vocabulary; don't overthink."] },
  summarizeWrittenText: { title: "Summarize Written Text", part: 1,

    tips: ["ONE sentence only — full stops inside the answer are fatal.", "Find the main claim, then attach 1–2 key supports with connectors (while, because, which, although).", "Aim 35–55 words.", "Save 1 minute to check subject-verb agreement and spelling."] },
  essay: { title: "Write Essay", part: 1,
    ins: "You will have 20 minutes to plan, write and revise an essay about the topic below. Your response will be judged on how well you develop a position, organize your ideas, present supporting details, and control the elements of standard written English. You should write 200–300 words.",
    tips: ["2–3 min plan: position + 2 arguments + examples.", "Structure: introduction (paraphrase + thesis) → body 1 → body 2 → conclusion.", "Start each body paragraph with a clear topic sentence; add an example.", "Save 2 minutes to proofread articles, plurals, verb endings."] },
  fibDropdown: { title: "Reading & Writing: Fill in the Blanks", part: 2,
    ins: "Below is a text with blanks. Click on each blank, and a drop-down list will appear. Select the appropriate answer choice for each blank.",
    tips: ["Read the whole sentence first for meaning, then use grammar (word form, collocation) to confirm.", "Verb tense/agreement and fixed collocations solve most blanks.", "These supply BOTH reading and writing marks — prioritise them."] },
  mcMultiple: { title: "Multiple Choice, Multiple Answers", part: 2,
    ins: "Read the text and answer the question by selecting all the correct responses. More than one response is correct. If you select a wrong option, one point is deducted, so do not guess.",
    tips: ["Skim the passage's main idea before reading options.", "Each correct option is usually a paraphrase of a passage detail.", "Avoid options that exaggerate ('always', 'never') beyond the text.", "Negative marking: skip an option if unsure."] },
  reorder: { title: "Re-order Paragraphs", part: 2,
    ins: "The text boxes in the left panel have been placed in a random order. Restore the original order by moving the text boxes.",
    tips: ["Find the opening sentence first: it has no pronouns, no 'this/these', no connectors like 'however'.", "Chain pronouns to nouns ('he' → the man; 'this method' → a method named earlier).", "Look for time sequence and lexical repetition links.", "Scoring counts adjacent pairs — even a partially correct chain earns points."] },
  fibDrag: { title: "Reading: Fill in the Blanks", part: 2,
    ins: "Below is a text with blanks. Drag words from the box below to fill the blanks.",
    tips: ["Sort the word bank by part of speech before dragging.", "Collocation is king: 'make a decision', 'heavy rain', 'conduct research'.", "Fill easiest blanks first; options shrink.", "Re-read completed text — it must flow grammatically."] },

    tips: ["Read the question BEFORE the passage.", "Eliminate options contradicted or not mentioned in the text.", "Correct answer paraphrases; distractors copy words but twist meaning."] },
  sst: { title: "Summarize Spoken Text", part: 3,

  fillBlanksL: { title: "Fill in the Blanks (Listening)", part: 3,

  hcs: { title: "Highlight Correct Summary", part: 3,
    ins: "Below are four possible summaries of the recording. Click on the paragraph that best captures what you have heard.",

    tips: ["Predict the word from context before the beep.", "Intonation direction (rising/falling) hints at positive/negative endings.", "Check grammar fit: singular/plural, verb form."] },

var flow = [];

function buildFlow() {

  addItems("readAloud", C.readAloud, 1);

/* ================= helpers ================= */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function key() { return "s" + state.step; }
function rkey(t, i) { return "r_" + t + "_" + i; }
function clearTimers() {
  state.timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
  state.timers = [];
  stopTTS();
}
function later(fn, ms) { var id = setTimeout(fn, ms); state.timers.push(id); return id; }
function every(fn, ms) { var id = setInterval(fn, ms); state.timers.push(id); return id; }
function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function beep() {
  try {
    var ctx = beep._ctx || (beep._ctx = new (window.AudioContext || window.webkitAudioContext)());
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 720; g.gain.value = 0.18;
    o.start(); o.stop(ctx.currentTime + 0.3);
  } catch (e) {}
}
function wordCount(t) { t = (t || "").trim(); return t ? t.split(/\s+/).length : 0; }

/* ================= TTS ================= */
function stopTTS() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} state.speaking = false; }
function speak(text, opts) {
  opts = opts || {};
  return new Promise(function (res) {
    if (!("speechSynthesis" in window)) { res(false); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.95; u.pitch = opts.pitch || 1; u.lang = opts.lang || "en-AU";
    u.onend = function () { res(true); };
    u.onerror = function () { res(false); };
    state.speaking = true;
    speechSynthesis.speak(u);
  });
}
function speakTurns(turns) {
  var pitches = { A: 1.0, B: 1.35, C: 0.75, D: 1.15 };
  var i = 0, cancelled = false;
  state.ttsCancel = function () { cancelled = true; };
  return new Promise(function (res) {
    (function next() {
      if (cancelled || i >= turns.length) { res(!cancelled); return; }
      speak(turns[i].text, { pitch: pitches[turns[i].speaker] || 1, rate: 0.95 }).then(next);
      i++;
    })();
  });
}

/* ================= audio play controller (enforces single play in real mode) ================= */
function playAudio(k, playFn, onDone) {
  if (state.mode === "real" && state.audioPlayed[k]) { if (onDone) onDone(false); return false; }
  state.audioPlayed[k] = true;
  playFn().then(function (ok) { state.speaking = false; if (onDone) onDone(ok); });
  return true;
}

/* ================= mic ================= */
function ensureMic() {
  if (state.mediaStream) return Promise.resolve(true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
  return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
    state.mediaStream = s; return true;
  }).catch(function () { return false; });
}
function startRecording(k) {
  if (!state.mediaStream) return false;
  state.recChunks = [];
  try { state.recorder = new MediaRecorder(state.mediaStream); } catch (e) { return false; }
  state.recorder.ondataavailable = function (e) { if (e.data.size) state.recChunks.push(e.data); };
  state.recorder.onstop = function () {
    var b = new Blob(state.recChunks, { type: state.recorder.mimeType || "audio/webm" });
    state.recordings[k] = URL.createObjectURL(b);
  };
  state.recorder.start();
  return true;
}
function stopRecording() {
  if (state.recorder && state.recorder.state !== "inactive") { try { state.recorder.stop(); } catch (e) {} }
}

          var buf = new Uint8Array(an.frequencyBinCount);
          every(function () {
            an.getByteTimeDomainData(buf);
            var m = 0; for (var i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128));

/* ================= step renderer ================= */
function renderStep() {
  clearTimers(); stopRecording();
  var f = flow[state.step];
  if (!f) { renderReview(); return; }
  if (f.kind === "reading") { startReadingPart(); return; }
  var meta = TYPE_META[f.type];
  var partLabel = SECTION_INFO[f.part].t + " · " + meta.title + " " + (f.idx + 1) + " of " + f.total;

  else if (WRITE_RENDER[f.type]) WRITE_RENDER[f.type](f, partLabel);

}
function next() { state.step++; renderStep(); }

/* ================= speaking items (generic state machine) ================= */
/* cfg: {showText, showImage, prepSec, recSec, audioFirst, audioTextFn, showPrompt} */
var SPEAK_CFG = {
  readAloud: { prep: 35, rec: 40, audio: false, show: "text" },
  repeatSentence: { prep: 0, rec: 15, audio: true, show: "none", delay: 3 },
  describeImage: { prep: 25, rec: 40, audio: false, show: "image" },
  retellLecture: { prep: 10, rec: 40, audio: true, show: "title" },
  respondToSituation: { prep: 20, rec: 40, audio: true, show: "prompt" },
  summarizeGroupDiscussion: { prep: 0, rec: 60, audio: true, show: "topic" },
  answerShortQuestion: { prep: 0, rec: 10, audio: true, show: "none", delay: 1 }
};
var SPEAK_RENDER = {};
["readAloud", "repeatSentence", "describeImage", "retellLecture", "respondToSituation", "summarizeGroupDiscussion", "answerShortQuestion"]
  .forEach(function (type) { SPEAK_RENDER[type] = function (f, partLabel) { renderSpeaking(f, partLabel, SPEAK_CFG[type]); }; });

function speakingContentHtml(f, cfg) {
  var d = f.data, h = "";
  if (cfg.show === "text") h += '<div class="promptbox">' + esc(d.text) + "</div>";
  if (cfg.show === "image") h += '<div class="figbox"><h3>' + esc(d.title || "") + "</h3>" + (d.svg || "") + "</div>";
  if (cfg.show === "title") h += '<div class="promptbox"><b>Topic:</b> ' + esc(d.title || "Lecture") + "</div>";
  if (cfg.show === "prompt") h += '<div class="promptbox">' + esc(d.prompt) + "</div>";
  if (cfg.show === "topic") h += '<div class="promptbox"><b>Discussion topic:</b> ' + esc(d.topic) + "</div>";
  return h;
}
function speakingAudioFn(f, cfg) {
  var d = f.data;
  if (!cfg.audio) return null;
  if (f.type === "summarizeGroupDiscussion") return function () { return speakTurns(d.turns); };
  if (f.type === "respondToSituation") return function () { return speak(d.audio || d.prompt); };
  if (f.type === "retellLecture") return function () { return speak(d.text, { rate: 0.92 }); };
  if (f.type === "repeatSentence" || f.type === "answerShortQuestion") return function () { return speak(d.text || d.question); };
  return null;
}
function renderSpeaking(f, partLabel, cfg) {
  var k = key(), d = f.data;
  var timerId = state.mode === "real" ? "spTimer" : null;
  var html = itemHead(f, partLabel, timerId) +
    speakingContentHtml(f, cfg) +
    '<div class="statusbar">' +
    '<span class="recdot" id="dot"></span>' +
    '<span class="statusline" id="stline">Waiting…</span>' +
    '<div class="audbar" id="bar"><div></div></div>' +
    '<span class="timechip" id="clock"></span>' +
    "</div>";
  if (state.mode === "guide") {
    html += '<div class="statusbar">' +
      (cfg.audio ? '<button class="btn sec small" id="gplay">▶ Play audio</button>' : "") +
      '<button class="btn sec small" id="grec">● Start recording</button>' +
      '<button class="btn sec small" id="gstop" disabled>■ Stop</button>' +
      "</div>" + guideExtra(f.type, d) +
      '<div id="guideNote"></div>';
  }
  html += '<div class="navrow"><span>' + (state.mode === "guide" ? '<button class="btn sec" id="prevbtn">← Back</button>' : "") + "</span>" +
    '<button class="btn" id="nextbtn"' + (state.mode === "real" ? " disabled" : "") + ">Next →</button></div></div></div>";
  render(html);

  var stline = document.getElementById("stline"), clock = document.getElementById("clock"),
      dot = document.getElementById("dot"), bar = document.getElementById("bar"),
      nextBtn = document.getElementById("nextbtn");
  var prevBtn = document.getElementById("prevbtn");
  if (prevBtn) prevBtn.onclick = function () { state.step--; renderStep(); };
  nextBtn.onclick = function () { stopRecording(); stopTTS(); next(); };

  function setBar(p, rec) { bar.className = "audbar" + (rec ? " rec" : ""); bar.firstElementChild.style.width = Math.min(100, p) + "%"; }
  function runTimer(sec, label, rec, done) {
    var total = sec;
    clock.textContent = fmt(sec);
    every(function () {
      sec -= 0.25; clock.textContent = fmt(sec); setBar((1 - sec / total) * 100, rec);
      if (sec <= 0) { clearTimers(); done(); }
    }, 250);
  }
  function startRecPhase() {
    beep();
    stline.textContent = "Recording — speak now";
    dot.classList.add("on");
    ensureMic().then(function (ok) { if (ok) startRecording(k); });
    runTimer(cfg.rec, "rec", true, function () {
      stopRecording(); dot.classList.remove("on");
      stline.textContent = "Recording finished";
      nextBtn.disabled = false;
      if (state.mode === "real") later(next, 800);
    });
  }
  function startPrepPhase() {
    if (cfg.prep > 0) {
      stline.textContent = "Preparing…";
      runTimer(cfg.prep, "prep", false, startRecPhase);
    } else startRecPhase();
  }
  function startAudioPhase() {
    var fn = speakingAudioFn(f, cfg);
    if (!fn) { startPrepPhase(); return; }
    stline.textContent = "Playing audio…";
    playAudio(k, fn, function () {
      if (state.mode === "real") later(startPrepPhase, (cfg.delay || 2) * 1000);
      else { stline.textContent = "Audio finished — press ● Start recording"; }
    });
  }

  if (state.mode === "real") {
    nextBtn.disabled = true;
    if (cfg.audio) later(startAudioPhase, 1200);
    else later(startPrepPhase, 1200);
    var t = document.getElementById(timerId);
    if (t) { var secs = cfg.prep + cfg.rec + (cfg.audio ? 200 : 0); }
  } else {
    nextBtn.disabled = false;
    stline.textContent = "Guide mode — work at your own pace";
    var gp = document.getElementById("gplay"), gr = document.getElementById("grec"), gs = document.getElementById("gstop");
    if (gp) gp.onclick = function () { stopTTS(); playAudio(k + "_g", speakingAudioFn(f, cfg), function () { stline.textContent = "Audio finished"; }); stline.textContent = "Playing audio…"; };
    gr.onclick = function () {
      ensureMic().then(function (ok) {
        if (!ok) { stline.textContent = "No microphone — recording skipped"; return; }
        beep(); startRecording(k); dot.classList.add("on");
        stline.textContent = "Recording — press ■ Stop when done";
        gr.disabled = true; gs.disabled = false;
      });
    };
    gs.onclick = function () { stopRecording(); dot.classList.remove("on"); stline.textContent = "Recording saved (see review at end)"; gr.disabled = false; gs.disabled = true; };
  }
  window._pteSample = d.sample || d.text || d.question || null;
}

/* ================= reading part ================= */
function startReadingPart() {
  clearTimers(); stopRecording();
  var items = readingItems();
  var cur = 0;
  var timerHtml = state.mode === "real" ? '<div class="timerbox" id="rdTimer">' + fmt(state.readingLeft) + "</div>" : "";
  function draw() {
    var it = items[cur], meta = TYPE_META[it.type], rk = rkey(it.type, it.idx);
    var nav = items.map(function (x, i) {
      var done = state.answers[rkey(x.type, x.idx)] != null;
      return '<button class="' + (i === cur ? "cur " : "") + (done ? "done" : "") + '" data-i="' + i + '">' + meta2short(x.type) + " " + (x.idx + 1) + "</button>";
    }).join("");
    var h = chrome("Part 2: Reading · " + meta.title + " " + (it.idx + 1) + " of " + it.total, timerHtml) +
      '<div class="main"><div class="readwrap"><div class="readnav">' + nav + "</div>" +

      '<div class="instructions">' + meta.ins + "</div>" + tipsHtml(it.type) +
      '<div id="rbody"></div>' +
      '<div class="navrow"><button class="btn sec" id="rprev"' + (cur === 0 ? " disabled" : "") + ">← Previous</button>" +
      (cur < items.length - 1
        ? '<button class="btn" id="rnext">Next →</button>'
        : '<button class="btn warn" id="rfinish">' + (state.mode === "real" ? "End Reading Part" : "Finish Reading → Listening") + "</button>") +
      "</div></div></div></div></div>";
    render(h);
    document.querySelectorAll(".readnav button").forEach(function (b) {
      b.onclick = function () { saveCur(); cur = +b.dataset.i; draw(); };
    });
    drawReadingBody(it, rk);
    var pv = document.getElementById("rprev"); if (pv) pv.onclick = function () { saveCur(); cur--; draw(); };
    var nx = document.getElementById("rnext"); if (nx) nx.onclick = function () { saveCur(); cur++; draw(); };
    var fn = document.getElementById("rfinish"); if (fn) fn.onclick = function () { saveCur(); finishReading(); };
  }
  function saveCur() {
    var it = items[cur], rk = rkey(it.type, it.idx);
    var v = collectReadingAnswer(it);
    if (v != null) state.answers[rk] = v;

/* ================= scoring ================= */
function norm(s) { return (s || "").toLowerCase().trim().replace(/[.,;:!?'"()-]/g, ""); }
function scoreItem(type, d, ans) {
  /* returns {got, max, detail} or null for non-objective */
  if (type === "fibDropdown") {
    var got = 0; d.blanks.forEach(function (b, i) { if (ans && ans[i] != null && +ans[i] === b.correct) got++; });
    return { got: got, max: d.blanks.length };
  }
  if (type === "fibDrag") {
    var g2 = 0; d.answers.forEach(function (a, i) { if (ans && norm(ans[i]) === norm(a)) g2++; });
    return { got: g2, max: d.answers.length };
  }
  if (type === "mcMultiple" || type === "mcmL") {
    if (!ans || !ans.length) return { got: 0, max: d.answers.length };
    var sc = 0; ans.forEach(function (a) { sc += d.answers.indexOf(a) >= 0 ? 1 : -1; });
    return { got: Math.max(0, sc), max: d.answers.length };
  }
  if (type === "mcSingle" || type === "mcsL" || type === "hcs" || type === "smw")
    return { got: ans != null && +ans === d.answer ? 1 : 0, max: 1 };
  if (type === "reorder") {
    if (!ans) return { got: 0, max: d.sentences.length - 1 };
    var pos = {}; ans.forEach(function (si, p) { pos[si] = p; });
    var ok = 0; for (var i = 0; i < d.sentences.length - 1; i++) if (pos[i] < pos[i + 1]) ok++;
    return { got: ok, max: d.sentences.length - 1 };
  }
  if (type === "fillBlanksL") {
    var g3 = 0; d.answers.forEach(function (a, i) { if (ans && norm(ans[i]) === norm(a)) g3++; });
    return { got: g3, max: d.answers.length };
  }
  if (type === "hiw") {
    var wrongIdx = []; d.words.forEach(function (w, i) { if (w.wrong) wrongIdx.push(i); });
    if (!ans || !ans.length) return { got: 0, max: wrongIdx.length };
    var s2 = 0; ans.forEach(function (i) { s2 += wrongIdx.indexOf(i) >= 0 ? 1 : -1; });
    return { got: Math.max(0, s2), max: wrongIdx.length };
  }
  if (type === "wfd") {
    var ref = norm(d.text).split(/\s+/), usr = norm(ans).split(/\s+/), g4 = 0;
    for (var j = 0; j < ref.length; j++) if (usr[j] === ref[j]) g4++;
    return { got: g4, max: ref.length };
  }
  return null;
}
function answerSummary(type, d, ans) {
  if (ans == null) return "<i>No answer</i>";
  if (type === "fibDropdown") return d.blanks.map(function (b, i) { return "Blank " + (i + 1) + ": " + (ans[i] != null && ans[i] !== "" ? esc(b.options[ans[i]]) : "—"); }).join(" · ");
  if (type === "fibDrag" || type === "fillBlanksL") return d.answers.map(function (a, i) { return "Blank " + (i + 1) + ": " + (ans[i] ? esc(ans[i]) : "—"); }).join(" · ");
  if (type === "mcMultiple" || type === "mcmL") return ans.length ? ans.map(function (a) { return esc(d.options[a]); }).join(" + ") : "<i>No selection</i>";
  if (type === "mcSingle" || type === "mcsL" || type === "hcs" || type === "smw") return esc(d.options[ans]);
  if (type === "reorder") return ans.map(function (si) { return "(" + (si + 1) + ")"; }).join(" → ");
  if (type === "hiw") return ans.length ? ans.map(function (i) { return '"' + esc(d.words[i].w) + '"'; }).join(" ") : "<i>No words highlighted</i>";
  if (type === "wfd" || type === "summarizeWrittenText" || type === "essay" || type === "sst") return esc(ans).slice(0, 600);
  return esc(JSON.stringify(ans));
}
function correctSummary(type, d) {
  if (type === "fibDropdown" || type === "fibDrag" || type === "mcMultiple" || type === "mcSingle" || type === "reorder") return readingKeyText({ type: type, data: d });
  if (type === "mcmL") return "Correct: " + d.answers.map(function (a) { return esc(d.options[a]); }).join(" + ");
  if (type === "mcsL" || type === "hcs" || type === "smw") return "Correct: " + esc(d.options[d.answer]);
  if (type === "fillBlanksL") return "Answers: " + d.answers.map(esc).join(" · ");
  if (type === "hiw") return "Incorrect words: " + d.words.filter(function (w) { return w.wrong; }).map(function (w) { return '"' + esc(w.w) + '" → said "' + esc(w.said) + '"'; }).join(" · ");
  if (type === "wfd") return esc(d.text);
  return "";
}

function renderReview() {
  clearTimers(); stopRecording();

    var k = "s" + i, ans = state.answers[k], meta = TYPE_META[f.type];

    var badge = sc ? (sc.got >= sc.max ? '<span class="badge ok">' + sc.got + "/" + sc.max + "</span>" : '<span class="badge no">' + sc.got + "/" + sc.max + "</span>") : '<span class="badge na">self-review</span>';
    var body = "";

      if (f.data.sample) body += sampleHtml("Sample response", f.data.sample);
      if (f.type === "summarizeWrittenText" || f.type === "essay" || f.type === "sst") {
        var n = wordCount(ans), lim = f.type === "summarizeWrittenText" ? [5, 75] : f.type === "sst" ? [50, 70] : [200, 300];
        body += '<div class="kv">Word count: <b class="' + (n >= lim[0] && n <= lim[1] ? "ok" : "no") + '">' + n + "</b> (required " + lim[0] + "–" + lim[1] + ")</div>";
      }

  var pct = totMax ? Math.round(totGot / totMax * 100) : 0;
  render(chrome("Score report", "") +
    '<div class="main"><div class="card" style="text-align:center">' +
    "<h1>Score Report</h1>" +
    '<div class="scorebig">' + pct + "%</div>" +
    '<div class="kv">Auto-scored objective items: ' + totGot + " / " + totMax + " points</div>" +
    '<div class="kv">Speaking &amp; open writing tasks are self-reviewed against the sample responses below. This is an indicative practice score, not a Pearson score.</div>' +
    '<div class="navrow"><button class="btn sec" onclick="PTE.restart()">← Restart exam</button><button class="btn sec" onclick="PTE.toggleMode()">Switch to ' + (state.mode === "real" ? "Guide" : "Real") + " mode</button></div>" +
    "</div>" + rows + "</div>");
}

/* ================= public API ================= */
window.PTE = {
  pickMode: function (m) {
    state.mode = m;
    ensureMic();
    renderMicCheck();
  },
  showSample: function () {
    var w = document.getElementById("sampleWrap");
    if (w && window._pteSample) w.innerHTML = sampleHtml("Sample answer", window._pteSample);
  },
  restart: function () {
    clearTimers();
    state.step = -1; state.answers = {}; state.recordings = {}; state.audioPlayed = {}; state.readingLeft = 30 * 60;
    renderHome();
  },
  toggleMode: function () {
    state.mode = state.mode === "real" ? "guide" : "real";
    clearTimers();
    state.audioPlayed = {}; state.readingLeft = 30 * 60; state.step = -1;
    renderSectionIntro(1);
  }
};

/* ================= boot ================= */
buildFlow();
renderHome();
})();

</script>
</body>
</html>
