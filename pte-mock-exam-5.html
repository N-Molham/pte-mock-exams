<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTE Academic Mock Exam 5 (2026 Format)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:#e8ecf1;color:#1c2733;font-size:16px;line-height:1.55}
#app{min-height:100%;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- header ---------- */
.topbar{background:#123c6d;color:#fff;padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .logo{font-weight:700;font-size:18px;letter-spacing:.5px}
.topbar .logo span{color:#7fd1f7}
.topbar .mode{font-size:12px;padding:2px 10px;border-radius:10px;background:#0a2a4e;border:1px solid #3d6d9e}
.topbar .mode.guide{background:#3d2a00;border-color:#c79a2e}
.topbar .spacer{flex:1}
.topbar .timerbox{font-variant-numeric:tabular-nums;background:#0a2a4e;border:1px solid #3d6d9e;border-radius:6px;padding:3px 12px;font-size:15px}
.topbar .timerbox.warn{border-color:#e05555;color:#ffb3b3}
.progress{height:5px;background:#0a2a4e}
.progress>div{height:100%;background:#41b6e6;width:0;transition:width .3s}

/* ---------- layout ---------- */
.main{flex:1;max-width:1020px;width:100%;margin:0 auto;padding:26px 22px 90px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(16,42,67,.15);padding:26px 30px;margin-bottom:18px}
.partlabel{font-size:13px;color:#5b6b7b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
h1{font-size:26px;color:#123c6d;margin-bottom:10px}
h2{font-size:21px;color:#123c6d;margin-bottom:8px}
h3{font-size:16px;color:#123c6d;margin:14px 0 6px}
.qtype-head{border-bottom:1px solid #dde4ea;padding-bottom:12px;margin-bottom:16px}
.qtype-head .qtitle{font-size:19px;font-weight:600;color:#123c6d}
.qtype-head .qpos{font-size:13px;color:#5b6b7b;float:right}
.instructions{color:#3d4f60;margin:6px 0 14px;font-size:15px}
.promptbox{background:#f2f6fa;border:1px solid #d5e0ea;border-radius:6px;padding:16px 20px;margin:12px 0;font-size:17px}
.figbox{background:#fff;border:1px solid #d5e0ea;border-radius:6px;padding:14px;margin:12px 0;text-align:center}
.figbox svg{max-width:100%;height:auto}
.mono{font-family:Consolas,monospace;font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-block;border:none;border-radius:5px;padding:10px 26px;font-size:15px;font-weight:600;background:#123c6d;color:#fff}
.btn:hover{background:#0d3058}
.btn:disabled{background:#9fb2c3;cursor:not-allowed}
.btn.sec{background:#fff;color:#123c6d;border:1px solid #123c6d}
.btn.sec:hover{background:#eef3f8}
.btn.warn{background:#b3261e}
.btn.small{padding:5px 14px;font-size:13px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.modewrap{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0}
.modecard{flex:1;min-width:260px;border:2px solid #d5e0ea;border-radius:8px;padding:20px 22px;cursor:pointer;background:#fff}
.modecard:hover{border-color:#41b6e6}
.modecard h3{margin-top:0}
.modecard ul{margin:8px 0 0 18px;font-size:14px;color:#3d4f60}

/* ---------- status / recording ---------- */
.statusbar{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.statusline{font-weight:600;color:#123c6d}
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c4cdd6}
.recdot.on{background:#e02424;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.audbar{flex:1;min-width:180px;height:8px;background:#dde4ea;border-radius:4px;overflow:hidden}
.audbar>div{height:100%;background:#41b6e6;width:0}
.audbar.rec>div{background:#e02424}
.timechip{font-variant-numeric:tabular-nums;font-weight:600;color:#123c6d;background:#eef3f8;border-radius:5px;padding:4px 12px}

/* ---------- guide tips ---------- */
.tipsbox{background:#fff8e6;border:1px solid #e8cf8a;border-left:5px solid #e0a800;border-radius:6px;padding:14px 18px;margin:14px 0;font-size:14px}
.tipsbox h4{color:#7a5800;margin-bottom:6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.tipsbox ul{margin-left:18px}
.tipsbox li{margin:3px 0}
.samplebox{background:#eafaf0;border:1px solid #9edbb4;border-radius:6px;padding:14px 18px;margin:12px 0;font-size:14.5px}
.samplebox h4{color:#166534;margin-bottom:6px;font-size:14px}

/* ---------- inputs ---------- */
textarea{width:100%;border:1px solid #b9c6d2;border-radius:6px;padding:12px;font-family:inherit;font-size:16px;line-height:1.6;resize:vertical}
textarea:focus{outline:2px solid #41b6e6}
input[type=text]{border:1px solid #b9c6d2;border-radius:5px;padding:8px 10px;font-size:15px;font-family:inherit}
input[type=text]:focus{outline:2px solid #41b6e6}
.wordcount{font-size:13px;color:#5b6b7b;margin-top:6px}
.wordcount.bad{color:#b3261e;font-weight:600}
select{border:1px solid #8fa4b8;border-radius:4px;padding:3px 6px;font-size:15px;background:#eef3f8;margin:0 2px}
.optrow{display:block;padding:9px 12px;border:1px solid #d5e0ea;border-radius:6px;margin:7px 0;cursor:pointer}
.optrow:hover{background:#f2f6fa}
.optrow.sel{border-color:#123c6d;background:#eaf3fb}
.optrow input{margin-right:9px}

/* ---------- reading layout ---------- */
.readwrap{display:flex;gap:18px}
.readnav{width:170px;flex-shrink:0}
.readnav button{display:block;width:100%;text-align:left;margin-bottom:5px;padding:7px 10px;border:1px solid #d5e0ea;background:#fff;border-radius:5px;font-size:13px}
.readnav button.cur{border-color:#123c6d;background:#eaf3fb;font-weight:600}
.readnav button.done::after{content:" ✓";color:#1a7f37}
.readmain{flex:1;min-width:0}
@media(max-width:760px){.readwrap{flex-direction:column}.readnav{width:100%;display:flex;flex-wrap:wrap}.readnav button{width:auto}}

/* ---------- drag blanks ---------- */
.fibbank{border:1px dashed #8fa4b8;border-radius:6px;padding:10px;margin:12px 0;min-height:48px}
.chip{display:inline-block;background:#123c6d;color:#fff;border-radius:4px;padding:5px 13px;margin:4px;cursor:pointer;font-size:14px;user-select:none}
.chip.used{opacity:.3;pointer-events:none}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid #123c6d;padding:2px 8px;margin:0 3px;text-align:center;cursor:pointer;color:#123c6d;font-weight:600;background:#eef3f8;border-radius:4px 4px 0 0}
.blank:empty::before{content:"\\200b"}

/* ---------- reorder ---------- */
.reitem{border:1px solid #d5e0ea;border-radius:6px;background:#fff;padding:11px 14px;margin:6px 0;display:flex;align-items:center;gap:10px}
.reitem .mv{display:flex;flex-direction:column;gap:2px}
.reitem .mv button{border:1px solid #b9c6d2;background:#f2f6fa;border-radius:4px;font-size:11px;padding:1px 8px;line-height:1.4}
.reitem .txt{flex:1}

/* ---------- HIW ---------- */
.hiw-word{cursor:pointer;padding:1px 2px;border-radius:3px}
.hiw-word:hover{background:#ffe9a8}
.hiw-word.sel{background:#f9c74f;color:#5b4300;font-weight:600}

/* ---------- review ---------- */
.scorebig{font-size:34px;font-weight:700;color:#123c6d}
.revitem{border:1px solid #dde4ea;border-radius:6px;padding:14px 18px;margin:10px 0;background:#fff}
.revitem h4{color:#123c6d;font-size:15px;margin-bottom:6px}
.revitem .ok{color:#1a7f37;font-weight:600}
.revitem .no{color:#b3261e;font-weight:600}
.revitem .ua{background:#f2f6fa;border-radius:4px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.badge{display:inline-block;font-size:12px;border-radius:9px;padding:1px 10px;margin-left:8px}
.badge.ok{background:#d9f2e3;color:#1a7f37}
.badge.no{background:#fadbd8;color:#b3261e}
.badge.na{background:#e8ecf1;color:#5b6b7b}
audio{display:block;margin:8px 0;max-width:100%}
.kv{font-size:14px;color:#3d4f60;margin:4px 0}

.footer-note{max-width:1020px;margin:0 auto;padding:12px 22px 30px;font-size:12.5px;color:#77879a}

</style>
</head>

<script>
const EXAM = {"meta":{"id":5,"title":"PTE Academic Mock Exam 5 (2026 Format)"},"readAloud":[{"text":"As freshwater supplies come under growing pressure, many coastal nations are turning to desalination, the removal of salt from seawater. Modern plants force water through fine membranes at high pressure, producing millions of litres of drinking water every day. The technology is reliable but costly, and disposing of the leftover brine without damaging marine life remains a significant environmental challenge."},{"text":"High-speed rail has transformed long-distance travel in countries that have invested in it. Trains travelling at three hundred kilometres per hour can compete directly with airlines on journeys of up to four hours, especially because stations are located in city centres. Supporters also point out that electrified railways produce far lower emissions per passenger than either cars or planes."},{"text":"Food fraud costs the global economy billions of dollars each year, and honey is among the most commonly faked products. Unscrupulous suppliers dilute pure honey with cheap sugar syrups or mislabel its country of origin to avoid import duties. Because many syrups are chemically similar to honey, laboratories must use advanced techniques, including DNA analysis and isotope testing, to expose the deception."},{"text":"Avalanche forecasters combine field observations with weather data to estimate the stability of the snowpack. They dig pits in the snow to examine individual layers, searching for weak crystals that could collapse under the weight of fresh snowfall. Their daily bulletins, which rate the danger on a five-point scale, help skiers and rescue services decide where travel is acceptably safe."},{"text":"Telehealth, the delivery of medical care through video calls and remote monitoring, expanded rapidly during the pandemic and has since become a permanent feature of healthcare. It is particularly valuable for patients in rural areas, who might otherwise travel for hours to see a specialist. Nevertheless, doctors acknowledge that some conditions can only be assessed properly through a physical examination."},{"text":"Street art has undergone a remarkable change in status over the past four decades. Murals that were once scrubbed away as vandalism are now protected by local councils, and works by famous street artists sell for millions at international auctions. Some critics worry, however, that commercial success and official approval have drained the movement of the rebellious energy that made it powerful."},{"text":"Co-working spaces have multiplied in cities around the world, offering freelancers and remote employees an alternative to working alone at home. For a monthly fee, members receive a desk, fast internet, and access to meeting rooms, as well as opportunities to network with people from other industries. Surveys suggest many members join primarily to escape isolation and rebuild a boundary between work and home life."}],"repeatSentence":[{"text":"The seminar on food safety has been moved to the main auditorium."},{"text":"All international students must attend the visa information session next Tuesday."},{"text":"The geology department organises field trips to the coast every spring."},{"text":"Please return the microphone to the technician after your presentation finishes."},{"text":"Our guest speaker has worked in avalanche rescue for twenty years."},{"text":"The railway station is only a ten-minute walk from the campus."},{"text":"Tutors expect you to reference every source you use in essays."},{"text":"The new sports centre offers discounted annual memberships to all full-time students."},{"text":"Last night's television documentary about honey fraud attracted millions of viewers."},{"text":"Your thesis draft must be uploaded to the system before midday Friday."}],"describeImage":[{"title":"Gig economy workers by sector (millions)","sample":"The bar chart shows the number of gig economy workers in four sectors. Transport is the largest category, with about 3.5 million workers, followed by delivery services at roughly 2.8 million. Freelance professional work accounts for around 2 million, while care work is the smallest sector, at just over 1 million. Overall, driving and delivery jobs dominate the gig economy, together employing more than half of all gig workers.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><line x1='60' y1='260' x2='500' y2='260' stroke='#333'/><line x1='60' y1='20' x2='60' y2='260' stroke='#333'/><text x='30' y='265' font-size='11'>0<\/text><text x='24' y='205' font-size='11'>1<\/text><text x='24' y='145' font-size='11'>2<\/text><text x='24' y='85' font-size='11'>3<\/text><text x='24' y='25' font-size='11'>4<\/text><rect x='90' y='50' width='70' height='210' fill='#2f6db3'/><rect x='190' y='92' width='70' height='168' fill='#2f6db3'/><rect x='290' y='140' width='70' height='120' fill='#2f6db3'/><rect x='390' y='188' width='70' height='72' fill='#2f6db3'/><text x='95' y='278' font-size='12'>Transport<\/text><text x='200' y='278' font-size='12'>Delivery<\/text><text x='295' y='278' font-size='12'>Freelance<\/text><text x='410' y='278' font-size='12'>Care<\/text><\/svg>"},{"title":"Global plant-based meat sales, 2018–2025 (US$ billions)","sample":"The line graph shows global sales of plant-based meat from 2018 to 2025. Sales stood at around 2.5 billion dollars in 2018 and then rose every single year. Growth accelerated noticeably after 2020, and by 2025 the market had reached just over 12 billion dollars. Overall, sales increased almost fivefold in only seven years, with the steepest rises in the second half of the period.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><line x1='60' y1='260' x2='500' y2='260' stroke='#333'/><line x1='60' y1='20' x2='60' y2='260' stroke='#333'/><text x='30' y='265' font-size='11'>0<\/text><text x='24' y='145' font-size='11'>7<\/text><text x='20' y='25' font-size='11'>14<\/text><polyline points='80,217 140,198 200,178 260,157 320,133 380,106 440,78 500,49' fill='none' stroke='#4f9d69' stroke-width='3'/><circle cx='80' cy='217' r='4' fill='#4f9d69'/><circle cx='260' cy='157' r='4' fill='#4f9d69'/><circle cx='500' cy='49' r='4' fill='#4f9d69'/><text x='70' y='278' font-size='11'>2018<\/text><text x='248' y='278' font-size='11'>2021<\/text><text x='480' y='278' font-size='11'>2025<\/text><\/svg>"},{"title":"Global food waste by stage of supply chain","sample":"The pie chart illustrates where food is wasted in the global supply chain. Households are responsible for the largest share, at 45 percent of all waste. Food service businesses such as restaurants account for 20 percent, and farms waste a further 20 percent. Retailers make up the smallest share, at 15 percent. In conclusion, most food waste happens after food leaves the farm, with homes wasting the most.","svg":"<svg xmlns='http://www.w3.org/2000/svg' width='520' height='300' viewBox='0 0 520 300'><rect width='520' height='300' fill='#fff'/><circle cx='180' cy='150' r='110' fill='#2f6db3'/><path d='M180,150 L214,255 A110,110 0 0 1 91,215 Z' fill='#e8a13d'/><path d='M180,150 L91,215 A110,110 0 0 1 91,85 Z' fill='#4f9d69'/><path d='M180,150 L91,85 A110,110 0 0 1 180,40 Z' fill='#d1495b'/><text x='330' y='80' font-size='12' fill='#2f6db3'>■ Households 45%<\/text><text x='330' y='110' font-size='12' fill='#e8a13d'>■ Food service 20%<\/text><text x='330' y='140' font-size='12' fill='#4f9d69'>■ Farms 20%<\/text><text x='330' y='170' font-size='12' fill='#d1495b'>■ Retail 15%<\/text><\/svg>"}],"retellLecture":[{"title":"How avalanche forecasting saves lives","sample":"The lecture explained that most fatal avalanches are triggered by the victims themselves or their companions rather than occurring randomly. Forecasters examine snowpack layers for weak crystals that may collapse under the weight of new snow. The speaker stressed that survival depends on education and on carrying three essentials: a transceiver, a probe and a shovel. Finally, the lecture noted that most buried survivors are dug out by companions within fifteen minutes.","text":"Avalanches kill around one hundred and fifty people worldwide every winter, yet most fatal slides are not random acts of nature. In roughly ninety percent of cases, the victim or someone in their group triggers the avalanche. The key to survival, therefore, lies in education and preparation. Forecasters assess the snowpack layer by layer, looking for weak, sugary crystals that can collapse suddenly under the weight of new snow. Before heading into the backcountry, every skier should carry three essential items: a transceiver, which sends out a radio signal, a probe for pinpointing a buried person, and a shovel, because most survivors are dug out by companions within fifteen minutes."},{"title":"The global problem of fake honey","sample":"The lecture described honey as the third most faked food in the world, after milk and olive oil. Fraudsters feed bees sugar syrup, harvest the honey too early, or blend in cheap rice and corn syrups. Because these syrups resemble genuine honey chemically, basic laboratory tests often fail to detect them, so regulators now use nuclear magnetic resonance profiling. The speaker concluded that cheap adulterated imports are driving honest beekeepers out of business.","text":"Honey is the third most faked food in the world, after milk and olive oil. Fraud takes several forms. Producers may feed bees sugar syrup instead of letting them forage, harvest the honey too early, or stretch supplies by blending in cheap rice or corn syrup. Because these syrups are made from plants similar to those bees visit, basic laboratory tests often fail to detect them. Regulators have turned to more sophisticated methods, such as nuclear magnetic resonance profiling, which compares a sample's chemical fingerprint against a database of genuine honeys. The economic stakes are high: cheap adulterated imports undercut honest beekeepers and have driven many producers out of business."}],"respondToSituation":[{"prompt":"Your flight to another city has just been cancelled, and you have a job interview there at ten o'clock tomorrow morning. You are now at the airline's service desk. Speak to the airline agent. What would you say?","audio":"Your flight to another city has just been cancelled, and you have a job interview there at ten o'clock tomorrow morning. You are now at the airline's service desk. Speak to the airline agent. What would you say?","sample":"Good morning, I really need your help. I was booked on the eight o'clock flight to Manchester, and it's just been cancelled. The problem is I have a job interview tomorrow at ten a.m., and this job means a lot to me. Could you please check if there's any seat left on another flight this evening — with any airline, I'm not fussy? If flying is impossible, would the airline cover a train ticket, or a hotel near the airport so I can take the first flight in the morning? I'd also like to know how to claim compensation, since the cancellation was the airline's fault. I understand this isn't your doing personally, and I really do appreciate whatever you can arrange. Thank you so much."},{"prompt":"You returned a rental car on time, but the rental company has charged you for a full extra day, saying the car came back after the closing time of the depot. The time-stamped photos you took when you dropped it off prove otherwise. Call the rental company's customer service. What would you say?","audio":"You returned a rental car on time, but the rental company has charged you for a full extra day, saying the car came back after the closing time of the depot. The time-stamped photos you took when you dropped it off prove otherwise. Call the rental company's customer service. What would you say?","sample":"Hello, I'm calling about an incorrect charge on my rental agreement, number RC-78412. Your company has charged me for an extra day, saying the vehicle was returned after the depot closed. That isn't correct — I have time-stamped photographs of the car parked at your depot taken at 4:52 in the afternoon, well before the six o'clock closing time, and I also received an email from your system confirming the return that day. Could you please review the records and reverse this charge? I'd also like written confirmation that the billing has been corrected, since I'll be disputing the amount with my bank otherwise. Thank you for your help."}],"summarizeGroupDiscussion":[{"topic":"Should companies replace human customer-service staff with chatbots?","sample":"The group debated replacing customer-service staff with chatbots. Speaker A favoured chatbots because they answer instantly, work around the clock, and are faster than waiting on hold for simple queries. Speaker B objected that bots fail on unusual problems, frustrate customers, and threaten call-centre jobs. Speaker C proposed a hybrid model in which bots handle routine queries and pass complex cases to humans along with the conversation history. In the end, all three converged on keeping an easy route to a human and retraining affected staff.","turns":[{"speaker":"A","text":"Honestly, I think chatbots are brilliant for most customer queries. They answer instantly, they're available at midnight, and they never lose their temper. For simple things like tracking an order or resetting a password, a bot is far faster than waiting forty minutes on hold."},{"speaker":"B","text":"I'd push back on that. The moment your problem is slightly unusual, the bot just loops the same useless answers, and it's infuriating. And let's not forget the human cost — call centres employ millions of people. Companies are basically swapping decent service for lower wage bills."},{"speaker":"C","text":"Isn't the answer a hybrid system? Let the bots handle the routine seventy percent of queries and hand anything complex to trained humans. My bank does that, and it works pretty well — the bot even passes the conversation history so you don't have to repeat yourself."},{"speaker":"A","text":"That handover point is crucial, though. If the transition to a human is smooth, fine — but some companies make it deliberately hard to reach a real person."},{"speaker":"B","text":"Exactly. I'd support chatbots if companies were required to offer a speak-to-a-human button at all times, and if the savings went into retraining staff rather than pure profit."},{"speaker":"C","text":"So we basically agree: bots for the simple tasks, guaranteed human backup, and some protection for the workers whose jobs change."}]},{"topic":"The government must choose between funding a high-speed rail line and expanding the city's airport. Which should get the money?","sample":"The speakers weighed a high-speed rail line against airport expansion. Speaker A championed rail for its lower emissions, central stations, and faster door-to-door times on short journeys. Speaker B defended the airport, stressing global connections, job creation, and cleaner aviation fuels. Speaker C supported rail because airport growth is concentrated in the short-haul market that trains can replace, while noting long-haul capacity is already sufficient. They ultimately agreed to prioritise rail while still funding compulsory airport safety upgrades.","turns":[{"speaker":"A","text":"I'd put the money into high-speed rail without hesitation. Trains emit a fraction of the carbon of planes, stations are in the city centre, and on journeys under four hours, rail is actually quicker door-to-door. Half the flights from our airport are short-haul routes a train could easily replace."},{"speaker":"B","text":"But the airport connects us to the rest of the world — rail can't fly you to Singapore or New York. Expansion would create thousands of jobs and attract international companies. And airlines are investing in cleaner fuels, so the environmental argument won't always be this one-sided."},{"speaker":"C","text":"You both assume it's either-or, but the budget is fixed. I lean towards rail, mainly because the airport's own figures show most of its growth is in the short-haul market — precisely the part rail can absorb. Long-haul capacity matters, but we already have enough of it."},{"speaker":"A","text":"Plus, rail construction creates jobs too, and the benefits flow to the regional cities along the line, not just the capital."},{"speaker":"B","text":"Fair point. I could accept rail first — as long as the airport's safety upgrades, which are compulsory anyway, still go ahead."},{"speaker":"C","text":"Agreed. Fund the rail line, keep the essential airport maintenance, and revisit expansion in five years."}]}],"answerShortQuestion":[{"question":"What do you call a scientist who studies earthquakes?","answer":"A seismologist"},{"question":"Which instrument is used to look at objects too small for the naked eye?","answer":"A microscope"},{"question":"What do you call a person who designs buildings?","answer":"An architect"},{"question":"What is the first meal of the day called?","answer":"Breakfast"},{"question":"What do we call the money people must pay to the government from their income?","answer":"Income tax"}],"summarizeWrittenText":[{"passage":"Elite sport has embraced sleep science with remarkable enthusiasm in recent years. Studies show that extending sleep to nine or ten hours a night improves sprint times, shooting accuracy, and reaction speed in athletes across a range of sports, while even modest sleep deprivation measurably slows decision-making and increases injury risk. Sleep is when the body releases growth hormone and repairs the microscopic muscle damage caused by training, so skimping on rest undermines the very adaptations that training is designed to produce. Many professional teams now employ sleep coaches, provide players with personalised sleep schedules, and have redesigned travel arrangements so that athletes cross fewer time zones before important matches. Some researchers argue that sleep offers the largest legal performance advantage still available in modern sport.","sample":"Because sleep improves athletic performance, speeds recovery and reduces injuries while deprivation undermines training, professional teams increasingly employ sleep coaches, personalised schedules and adjusted travel plans, leading some researchers to describe sleep as the greatest legal performance advantage remaining in sport."},{"passage":"Telehealth — consultations conducted by telephone or video — moved from the margins of medicine to the mainstream almost overnight during the COVID-19 pandemic, and much of that shift appears permanent. The benefits are clearest for routine care: repeat prescriptions, mental-health check-ins, and follow-up appointments can be handled without travel, saving time for patients and clinics alike. Rural communities, where specialists may be hundreds of kilometres away, gain access that geography once denied them. Yet the model has boundaries. A camera cannot feel an abdomen, listen closely to a chest, or take blood, and video quality depends on internet connections that remain unreliable in many regions. Most clinicians therefore envisage a blended future, in which telehealth handles appropriate cases while physical examinations remain reserved for those who genuinely need them.","sample":"Although telehealth expanded rapidly during the pandemic and offers clear benefits for routine care and rural access, its inability to perform physical examinations and its dependence on reliable internet mean most clinicians favour a blended model combining remote consultations with in-person care."}],"essay":[{"prompt":"Some people regard graffiti and street art as a legitimate form of artistic expression, while others see it as vandalism that should be punished. Discuss both views and give your own opinion. Write 200–300 words.","sample":"Possible structure: (1) Introduction — paraphrase the debate, state your position, e.g. street art can be legitimate art when done with permission. (2) Case for street art: transforms dull public spaces, gives a voice to marginalised groups, is recognised by galleries and auction houses, and cities like Berlin and Melbourne attract tourists with their murals. (3) Case against: tagging and unwanted graffiti damage private property, cost councils millions to clean, and make areas feel neglected. (4) Conclusion — your view, e.g. legal walls and commissioned murals preserve the creativity while removing the harm. Useful phrases: 'It is often claimed that…', 'Supporters of street art point out that…', 'Critics, however, argue…', 'A balanced view would be…', 'In conclusion, I believe…'"}],"reading":{"fibDropdown":[{"text":"As freshwater becomes scarcer, many coastal nations are investing in desalination, the process of removing {{1}} from seawater. Modern plants use membranes that filter water under high pressure, a method far more {{2}}-efficient than older techniques. Nevertheless, desalination remains expensive, and the salty brine it {{3}} can harm marine ecosystems. Engineers are now testing ways to recover valuable minerals from this {{4}}.","blanks":[{"options":["salt","sand","sugar","smoke"],"correct":0},{"options":["energy","money","time","space"],"correct":0},{"options":["produces","prevents","purchases","protects"],"correct":0},{"options":["equipment","waste","budget","research"],"correct":1}]},{"text":"Plant-based meat alternatives are designed to {{1}} the taste and texture of real meat. Manufacturers use proteins from soy, peas, or wheat, and add ingredients such as beetroot juice to {{2}} the red colour of beef. Sales have grown rapidly, {{3}} among young consumers concerned about the environment. Critics, however, note that many products are highly processed and {{4}} large amounts of salt.","blanks":[{"options":["imitate","increase","import","improve"],"correct":0},{"options":["remove","create","measure","avoid"],"correct":1},{"options":["hardly","rarely","especially","never"],"correct":2},{"options":["contain","produce","reduce","lack"],"correct":0}]},{"text":"The gig economy allows people to earn money through short-term jobs found on digital platforms. Supporters value the {{1}} it offers, since workers can choose when and where to work. Critics, {{2}}, argue that gig workers lack the {{3}} that traditional employees receive, such as paid holidays and sick leave. Several governments are now considering laws that would {{4}} platform workers as employees.","blanks":[{"options":["flexibility","fragility","formality","familiarity"],"correct":0},{"options":["moreover","therefore","however","similarly"],"correct":2},{"options":["salaries","benefits","offices","uniforms"],"correct":1},{"options":["classify","confuse","compare","combine"],"correct":0}]},{"text":"A moderate amount of stress before an exam can actually {{1}} performance by sharpening concentration. When stress becomes overwhelming, {{2}}, it interferes with memory and reasoning. Research suggests that the most effective way to {{3}} exam anxiety is thorough preparation, combined with regular sleep and exercise. Students who catastrophise — imagining the worst possible {{4}} — tend to perform worse than their calmer peers.","blanks":[{"options":["enhance","endanger","erase","exclude"],"correct":0},{"options":["therefore","instead","however","furthermore"],"correct":2},{"options":["create","manage","ignore","spread"],"correct":1},{"options":["outcome","income","welcome","overview"],"correct":0}]},{"text":"Telehealth allows patients to consult doctors by video rather than visiting a clinic in {{1}}. The approach proved invaluable during the pandemic and remains popular for routine {{2}} such as prescription renewals. Nevertheless, telehealth has clear {{3}}: doctors cannot physically examine patients, and poor internet connections can disrupt consultations. Most experts agree it should {{4}} rather than replace face-to-face care.","blanks":[{"options":["person","public","private","print"],"correct":0},{"options":["operations","appointments","experiments","emergencies"],"correct":1},{"options":["advantages","limits","origins","purposes"],"correct":1},{"options":["compete","confuse","complement","complain"],"correct":2}]}],"mcMultiple":[{"passage":"Co-working spaces have spread rapidly through cities worldwide. For a monthly membership fee, freelancers and remote employees gain a desk, reliable internet, meeting rooms, and, often more importantly, contact with other professionals. Surveys of members repeatedly highlight reduced loneliness as a key benefit; working from home can be isolating, and coffee shops are noisy and insecure. Companies, too, are renting co-working desks for staff who live far from headquarters, since short memberships are cheaper and more flexible than long office leases. Critics point out, however, that the constant social buzz can itself become a distraction, and that hot-desking makes it hard to personalise a workspace.","question":"Which of the following are mentioned in the text as features or effects of co-working spaces?","options":["Members often feel less lonely than when working from home","Co-working memberships guarantee higher income for freelancers","Companies use co-working desks because they are cheaper and more flexible than office leases","The lively atmosphere can be distracting for some users","Most co-working spaces are funded by city councils"],"answers":[0,2,3]},{"passage":"Food allergies appear to be increasing in many countries, particularly among children. Researchers estimate that around eight percent of children now react to at least one food, with peanuts, eggs, and milk the most common triggers. The reasons remain debated: one influential theory links the rise to overly hygienic environments that leave young immune systems undertrained, while others blame changes in diet or the delayed introduction of allergenic foods in infancy. Encouragingly, many children outgrow allergies to milk and eggs, though peanut allergies usually persist for life. For those affected, strict avoidance is essential, and many schools now ban nuts from lunchboxes and train staff to use emergency adrenaline injectors.","question":"According to the passage, which statements about food allergies are true?","options":["Peanuts, eggs and milk are among the most common triggers","Improved hygiene may contribute to the rise in allergies","Children who are allergic to peanuts normally outgrow the allergy","Some schools have banned nuts from lunchboxes","Food allergies can be cured with regular medication"],"answers":[0,1,3]}],"reorder":[{"sentences":["High-speed rail began in Japan with the launch of the Shinkansen in 1964.","The new line cut the journey between Tokyo and Osaka by more than half.","Its success inspired other countries, notably France, to build their own high-speed networks.","Today, high-speed trains operate across Europe and Asia, carrying billions of passengers every year."]},{"sentences":["Street art has moved from the margins of society into the cultural mainstream.","Once dismissed as vandalism, works by artists such as Banksy now sell for millions at auction.","Many city councils have responded by commissioning murals to revitalise neglected neighbourhoods.","Nevertheless, debate continues about whether commercial success has undermined street art's rebellious spirit."]}],"fibDrag":[{"text":"Most avalanches are {{1}} by the weight of fresh snow or by the victims themselves. Carrying a transceiver and probe greatly increases the chance of a rapid {{2}}.","answers":["triggered","rescue"],"bank":["triggered","rescue","gentle","prevented","fortune","widely"]},{"text":"Customer-service chatbots can answer simple {{1}} instantly, day or night. However, they often fail when a problem requires {{2}} or human judgement.","answers":["queries","empathy"],"bank":["queries","empathy","salary","ancient","rapidly","buildings"]},{"text":"People with severe food allergies must read every label {{1}}, because even traces of an allergen can {{2}} a dangerous reaction.","answers":["carefully","trigger"],"bank":["carefully","trigger","loudly","prevent","harmless","ocean"]},{"text":"Elite athletes treat sleep as part of their {{1}} programme. Even one night of poor sleep can {{2}} reaction time and accuracy.","answers":["training","impair"],"bank":["training","impair","budget","improve","smoothly","garden"]}],"mcSingle":[{"passage":"Despite decades of research, scientists still cannot predict the exact time and place of an earthquake. What they can do is map fault lines, measure the slow build-up of strain in rocks, and calculate the probability of a major quake within a region over coming decades. More immediately useful are early-warning systems. Because the fast-moving but harmless primary waves arrive seconds before the destructive secondary waves, sensors can detect a quake and automatically slow trains, open lift doors, and alert hospitals before the violent shaking begins. In Japan and Mexico, such systems already give residents precious seconds to take cover.","question":"What does the passage mainly discuss?","options":["Scientists can now predict earthquakes several days in advance","Hazard mapping and early-warning systems are more realistic than exact prediction","Primary waves cause most of the damage in an earthquake","Earthquake early-warning systems exist only in Japan"],"answer":1},{"passage":"Honey is one of the most frequently adulterated foods on the market. Fraudsters dilute it with syrups made from rice, corn, or sugar beet, which are cheap and, crucially, derived from plants with chemistry similar to the flowers bees visit. As a result, adulterated honey can pass many of the standard tests designed to catch it. To stay ahead, regulators increasingly rely on nuclear magnetic resonance, which builds a detailed chemical fingerprint of a sample and compares it with reference profiles of genuine honey. Even so, fraudsters adapt quickly, and testing laboratories describe the situation as a continuing arms race.","question":"According to the passage, why is honey fraud difficult to detect with standard tests?","options":["Honey is produced in too many different countries","The added syrups are chemically similar to genuine honey","Laboratories refuse to test imported honey","Nuclear magnetic resonance is too expensive to use"],"answer":1}]},"listening":{"summarizeSpokenText":[{"title":"Sleep: the athlete's legal performance enhancer","sample":"The speaker explained that sports science has reversed the old habit of waking athletes at dawn. In one study, basketball players who slept ten hours improved their sprint times and shooting accuracy. Sleep is active recovery, releasing growth hormone and consolidating skills, while even partial sleep deprivation slows reactions and doubles injury rates. Consequently, professional teams now hire sleep consultants, schedule later training after late matches, and plan travel to minimise jet lag.","audio":"Coaches once bragged about waking players at dawn, but sports science has reversed that thinking. When basketball players in one study extended their sleep to ten hours a night, their sprint times and shooting accuracy improved significantly, and they reported feeling better. Sleep is not passive recovery; it is when the body releases growth hormone and consolidates the skills practised during training. Even partial sleep deprivation slows reaction times and doubles injury rates in adolescents. For this reason, professional teams now hire sleep consultants, schedule later training sessions after late matches, and design travel plans that minimise jet lag. Sleep, in short, has become the last legal performance enhancer."},{"title":"Why food allergies are on the rise","sample":"The lecture noted that food allergies are far more common than in the past, with hospital admissions for severe reactions tripling in some countries and peanut allergy affecting about two percent of children. The leading explanation, the hygiene hypothesis, blames overly clean homes that leave young immune systems undertrained, while other researchers point to changes in infant feeding, since early introduction of peanuts lowered allergy rates. Whatever the cause, the trend has transformed school lunches and food labelling laws.","audio":"Food allergies are far more common than they used to be, and the statistics agree. Hospital admissions for severe allergic reactions have tripled in some countries over the past twenty years, and peanut allergy alone now affects around two percent of children. Why this is happening is less clear. The leading explanation, the hygiene hypothesis, argues that modern homes are so clean that young immune systems, deprived of contact with dirt and microbes, mistake harmless foods for threats. Other researchers point to changes in infant feeding, noting that countries which introduced peanuts early saw allergy rates fall. Whatever the cause, the trend has transformed school lunches and food labelling laws."}],"mcMultiple":[{"audio":"Hello everyone, just a few campus updates before the lecture begins. The swimming pool at the sports centre will be closed all of next week while a new filtration system is installed, but the gym and courts remain open as normal. Second, the new bike-share scheme is now live — you can register with your student card at the library help desk. And finally, good news for late-night studiers: the cafeteria will extend its opening hours until midnight throughout the exam period, starting Monday.","question":"Which of the following does the announcement state?","options":["The pool will be closed next week for maintenance","The gym will also be closed next week","Students can register for the bike-share scheme at the library","The cafeteria will open until midnight during the exam period","The extended cafeteria hours begin on Friday"],"answers":[0,2,3]}],"fillBlanks":[{"display":"Coastal cities facing water shortages increasingly rely on {{1}} plants. These facilities remove salt from seawater, but the process consumes large amounts of {{2}} and produces a concentrated {{3}} that must be disposed of carefully.","answers":["desalination","energy","brine"],"audio":"Coastal cities facing water shortages increasingly rely on desalination plants. These facilities remove salt from seawater, but the process consumes large amounts of energy and produces a concentrated brine that must be disposed of carefully."},{"display":"To join the climbing club, students must attend a {{1}} session on Thursday. Membership costs twenty dollars per {{2}}, and the fee includes all {{3}}.","answers":["training","semester","equipment"],"audio":"To join the climbing club, students must attend a training session on Thursday. Membership costs twenty dollars per semester, and the fee includes all equipment."},{"display":"Researchers studied how chatbots handle customer {{1}}. The bots solved simple requests quickly, but complex {{2}} still required a human {{3}}.","answers":["complaints","cases","agent"],"audio":"Researchers studied how chatbots handle customer complaints. The bots solved simple requests quickly, but complex cases still required a human agent."}],"highlightCorrectSummary":[{"audio":"Every winter, avalanches kill skiers, snowboarders, and climbers in mountain regions worldwide. Research has overturned a popular myth: in the vast majority of cases, the slide is triggered not by chance but by the victim or a companion. The most dangerous conditions occur when heavy new snow falls on top of old, weak layers, especially on slopes between thirty and forty-five degrees. The good news is that education works. Skiers who check forecasts, carry rescue equipment, and avoid steep slopes after storms are involved in far fewer accidents.","options":["Avalanches are random natural events that cannot be anticipated, so carrying rescue equipment is pointless.","Most avalanches are triggered by the victims themselves, and informed behaviour — checking forecasts, carrying equipment and avoiding risky slopes — reduces accidents.","Slopes steeper than forty-five degrees are the most dangerous because new snow slides off them easily.","Avalanche education programmes have failed, since accident numbers keep rising every year."],"answer":1}],"mcSingle":[{"audio":"Hi Dr Lane, do you have a moment? I'm in your Tuesday afternoon tutorial, but my manager at the pharmacy has changed my shifts, and I now work Tuesday afternoons. There's space in the Thursday morning group. Would it be possible to transfer? I've emailed the administration office, but they said I need your approval first.","question":"Why did the student speak to Dr Lane?","options":["To ask for an extension on an assignment","To get approval to change tutorial groups","To complain about her pharmacy shifts","To register for a new course"],"answer":1}],"selectMissingWord":[{"audio":"Many students believe that rereading their notes is the best way to revise, but research shows that testing yourself is far more effective. Each time you try to recall information, you strengthen the memory. So before your next exam, close the book and ask yourself what you actually","options":["remember","attended","photocopied","borrowed"],"answer":0,"fullText":"So before your next exam, close the book and ask yourself what you actually remember."}],"highlightIncorrectWords":[{"words":[{"w":"High-speed"},{"w":"trains"},{"w":"connect"},{"w":"most"},{"w":"major"},{"w":"European"},{"w":"cities."},{"w":"The"},{"w":"journey"},{"w":"from"},{"w":"Paris"},{"w":"to"},{"w":"Brussels","wrong":true,"said":"Berlin"},{"w":"takes"},{"w":"just"},{"w":"over"},{"w":"an"},{"w":"hour,"},{"w":"often"},{"w":"faster","wrong":tr }
function later(fn, ms) { var id = setTimeout(fn, ms); state.timers.push(id); return id; }
function every(fn, ms) { var id = setInterval(fn, ms); state.timers.push(id); return id; }

/* ================= TTS ================= */
/* Hash of a spoken string; must match tools/render-audio.mjs. */
function hashText(text, speaker) {
  var s = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
  if (speaker) s = speaker + "\u0001" + s;
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
/* Audio lives next to the page on GitHub Pages, one level up when the exam
   file is opened from a local exams/ checkout. */
function audioBases() {
  var dir = "audio/exam" + ((C.meta && C.meta.id) || 1) + "/";
  return [dir, "../" + dir];
}
/* Play a pre-rendered clip. Returns null when no clip exists (caller falls

function playClip(text, speaker) {

  return new Promise(function (res) {
    var bases = audioBases(), attempt = 0, settled = false, el;
    function finish(ok) {
      if (settled) return;
      settled = true;
      if (state.audioEl === el) state.audioEl = null;
      state.speaking = false;
      res(ok);
    }
    function start() {
      el = new Audio(bases[attempt] + hash + ".mp3");
      el.preload = "auto";
      state.audioEl = el;
      state.speaking = true;
      el.onended = function () { finish(true); };
      el.onerror = function () {
        if (el === state.audioEl) state.audioEl = null;
        attempt++;
        if (attempt < bases.length) start(); else finish(false);

      var p = el.play();
      if (p && p.catch) p.catch(function () { finish(false); });
    }
    start();
  });
}
function stopTTS() {
  var el = state.audioEl;
  state.audioEl = null;
  if (el) { try { el.pause(); el.removeAttribute("src"); el.load(); } catch (e) {} }
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}

  if (state.ttsCancel) { var cancel = state.ttsCancel; state.ttsCancel = null; try { cancel(); } catch (e) {} }
}
function speakFallback(text, opts) {
  return new Promise(function (res) {
    if (!("speechSynthesis" in window)) { res(false); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.95; u.pitch = opts.pitch || 1; u.lang = opts.lang || "en-AU";

}

}
function speakTurns(turns) {

  var pitches = { A: 1.0, B: 0.75, C: 1.3, D: 0.9 };
  var i = 0, cancelled = false;
  var cancel = function () { cancelled = true; };
  state.ttsCancel = cancel;
  return new Promise(function (res) {
    (function next() {
      if (cancelled || i >= turns.length) {
        if (state.ttsCancel === cancel) state.ttsCancel = null;
        res(!cancelled);
        return;
      }
      var turn = turns[i];
      speak(turn.text, { speaker: turn.speaker, pitch: pitches[turn.speaker] || 1, rate: 0.95 }).then(next);
      i++;
    })();
  });
}

/* ================= audio play controller (enforces single play in real mode) ================= */
function playAudio(k, playFn, onDone) {
  if (state.mode === "real" && state.audioPlayed[k]) { if (onDone) onDone(false); return false; }
  state.audioPlayed[k] = true;
  playFn().then(function (ok) { state.speaking = false; if (onDone) onDone(ok); });
  return true;
}

/* ================= mic ================= */
function ensureMic() {
  if (state.mediaStream) return Promise.resolve(true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);

    state.mediaStream = s; return true;

}

  state.recorder.onstop = function () {

}

/* Speech recognition turns a spoken response into text so it can be scored.

function srCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

    }
    var badge = sc ? (sc.got >= sc.max ? '<span class="badge ok">' + sc.got + "/" + sc.max + "</span>" : '<span class="badge no">' + sc.got + "/" + sc.max + "</span>") : '<span class="badge na">self-review</span>';
    var body = '<div class="ua"><b>Your answer:</b> ' + answerSummary(it.type, it.data, ans) + "</div>";
    var cs = correctSummary(it.type, it.data);
    if (cs) body += '<div class="ua" style="background:#eafaf0"><b>Correct:</b> ' + cs + "</div>";
    rows += '<div class="revitem"><h4>Part 2 · ' + meta.title + " " + (it.idx + 1) + badge + "</h4>" + body + "</div>";
  });
  var pct = totMax ? Math.round(totGot / totMax * 100) : 0;
  var breakdown = "";
  ["1:Speaking &amp; Writing", "2:Reading", "3:Listening"].forEach(function (row) {
    var bits = row.split(":"), bp = byPart[bits[0]];
    if (!bp || !bp.max) return;
    var line = "Part " + bits[0] + " · " + bits[1] + ": <b>" + round1(bp.got) + " / " + round1(bp.max) + "</b> (" + Math.round(bp.got / bp.max * 100) + "%)";
    if (bits[0] === "2" && readW) line += " · test-weighted <b>" + Math.round(readGotW / readW * 100) + "%</b>";
    breakdown += '<div class="kv">' + line + "</div>";
  });
  render(chrome("Score report", "") +
    '<div class="main"><div class="card" style="text-align:center">' +
    "<h1>Score Report</h1>" +
    '<div class="scorebig">' + pct + "%</div>" +
    '<div class="kv">Auto-scored: ' + round1(totGot) + " / " + round1(totMax) + " points</div>" +
    breakdown +
    '<div class="kv">Speaking responses are transcribed by the browser (Chrome/Edge) and scored on word accuracy or key-term coverage. Summarize Written Text and the Essay are scored on key-point coverage, word limits, paragraph structure, connectives and academic collocations; Summarize Spoken Text on coverage and length. The reading percentage is weighted by task value (Fill in the Blanks dominates). Describe Image has no text reference, so it stays self-reviewed. Indicative practice score, not a Pearson score.</div>' +
    '<div class="navrow"><button class="btn sec" onclick="PTE.restart()">← Restart exam</button><button class="btn sec" onclick="PTE.toggleMode()">Switch to ' + (state.mode === "real" ? "Guide" : "Real") + " mode</button></div>" +
    "</div>" + rows + "</div>");
}

/* ================= public API ================= */
window.PTE = {
  pickMode: function (m) {
    state.mode = m;
    ensureMic();
    renderMicCheck();
  },
  showSample: function () {
    var w = document.getElementById("sampleWrap");
    if (w && window._pteSample) w.innerHTML = sampleHtml("Sample answer", window._pteSample);
  },
  /* Debug/verification hook: score any item without running the exam. */
  _score: function (type, data, ans, transcript) {
    return scoreItem(type, data, ans) || scoreOpen(type, data, ans, transcript);
  },
  restart: function () {
    clearTimers();
    state.step = -1; state.answers = {}; state.recordings = {}; state.audioPlayed = {}; state.readingLeft = 30 * 60;
    state.transcripts = {};
    renderHome();
  },
  toggleMode: function () {
    state.mode = state.mode === "real" ? "guide" : "real";
    clearTimers();
    state.audioPlayed = {}; state.readingLeft = 30 * 60; state.step = -1;
    renderSectionIntro(1);
  }
};

/* ================= boot ================= */
buildFlow();
renderHome();
})();

</script>
</body>
</html>
